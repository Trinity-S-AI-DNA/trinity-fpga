# Secret gate for gHashTag/trinity-fpga. Shared rules: canonical copy in gHashTag/t27 .gitleaks.toml (PR #6433).
#
# Three layers, each catching what the one before missed:
#   1. lefthook pre-commit  -> gitleaks scans staged changes (lefthook.yml)
#   2. lefthook pre-push    -> gitleaks scans commits not yet on any remote
#   3. CI secret-scan       -> gitleaks scans the PR range; cannot be skipped
#                              with --no-verify (.github/workflows/secret-scan.yml)
# Secrets belong in the environment or in gitignored files, never in the tree.

[extend]
useDefault = true

# The default rules miss Wi-Fi passphrases and other plain passwords.
[[rules]]
id = "hardcoded-password-literal"
description = "Hardcoded password/passphrase string literal (e.g. Wi-Fi credentials in firmware)"
regex = '''(?i)\b[a-z_]*(passphrase|password|passwd|wifi_?pass|psk)[a-z_]*\b["']?\s*[:=]\s*["']([^"'<>${}\s]{6,})["']'''
secretGroup = 2
keywords = ["passphrase", "password", "passwd", "wifi", "psk"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)(your|example|changeme|placeholder|dummy|test|xxx|\*\*\*)''']

[[allowlists]]
description = "Known non-secrets by path: synthetic Kaggle data, public contract addresses, BibTeX keys, archived fake keys"
paths = [
  '''targets/kaggle/kaggle/(data|generators|scripts|results)/.*''',
  '''deploy/(trinity-nexus/)?contracts/deployment-.*\.json''',
  '''research/bibliography_defects\.py''',
  '''deploy/trinity-nexus/vibee/archive/.*''',
  '''wave_audit/.*\.md''',
]

[[allowlists]]
description = "Workflow chipdb cache keys are not credentials. No paths: paths + condition=AND skips whole files in gitleaks 8.30."
regexTarget = "line"
regexes = ['''^\s*(restore-)?keys?:\s*chipdb-[a-z0-9-]+\s*$''']

[[allowlists]]
description = "Known non-secret lines: public token address, RFC 6455 example"
regexTarget = "line"
regexes = [
  '''TRI_TOKEN_ADDRESS''',
  '''Sec-WebSocket-Key''',
  '''restore-keys:''',
]
