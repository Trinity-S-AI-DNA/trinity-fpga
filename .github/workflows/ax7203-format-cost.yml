name: AX7203 Format Cost Ablation (CI-synth)
# Цена формата на одинаковой ткани Artix-7: LUT/FF/Fmax ядер
# GF8(e3m4) vs FP8(e4m3) vs INT8 по ADD и MUL в ИДЕНТИЧНОЙ UART-обёртке.
# Обёртка (UART RX/TX + frame FSM) у всех плеч одна и та же =>
# разница метрик = разница ядер. Статус результата: [измерено CI-synth],
# НЕ [измерено на кремнии] — это synth+P&R метрики, не прогон на плате.
#
# Честные оговорки:
#  - -nocarry (канонический флаг corona-потока) запрещает carry-цепи и
#    штрафует INT8-сумматор; для контроля yosys прогоняется дважды
#    (nocarry и carry), nextpnr — только на каноническом варианте.
#  - Fmax из nextpnr при --freq 50 = оценка достижимой частоты mclk-домена
#    (CFGMCLK ~65 MHz), критический путь включает обёртку.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # This synthesises gf_adder_param.v and gf_mul_param.v and watched neither,
    # so editing the RTL it measures triggered nothing -- it was the only
    # workflow in the repo watching solely its own file. Invisible until
    # paths_block() stopped skipping the inline form this very line uses.
    paths:
      - '.github/workflows/ax7203-format-cost.yml'
      - 'fpga/openxc7-synth/gf_adder_param.v'
      - 'fpga/openxc7-synth/gf_mul_param.v'

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        cell: [gf8_add, gf8_mul, fp8_e4m3_add, fp8_e4m3_mul, int8_add, int8_mul]
    steps:
      - uses: actions/checkout@v4
      - name: Docker pull regymm/openxc7 (retry on transient 5xx)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }
      # -nodsp on BOTH branches. MEASURED, not assumed.
      #
      # This workflow had never succeeded: 0 of 6 runs. gf8_mul failed to route --
      #   Failed to find a route for arc 100 of net $PACKER_GND_NET
      #   ERROR: Routing design failed  ->  "::error::no clean seed"
      # while gf8_add, int8_add and both fp8_e4m3 cells routed fine.
      #
      # Adding -nodsp fixed it. Run 34016575130 on ci/format-cost-nodsp: all six
      # matrix cells succeeded, and gf8_mul routed at seed=heap/router1/seed1 --
      # the FIRST configuration and the FIRST seed of the cascade below.
      #
      # Yosys was inferring DSP48E1 for the GF multiplier. Every GF multiplier
      # workflow in this repo that works already passes the flag
      # (ax7203-gf10-mul, gf12-mul-clean, gf16-mul-clean); this was the only GF
      # mul path omitting it, and the only one that had never routed.
      #
      # Both branches, not just the failing one: they exist to isolate the effect
      # of -nocarry, so changing one alone would leave them differing in two
      # dimensions and confound the ablation. Applied to every matrix cell for the
      # same reason -- a format-cost comparison needs one recipe across formats.
      # Nothing published depended on the old flags: 0 successes meant there was
      # never a measurement to invalidate.
      - name: Yosys (canonical, -nocarry)
        run: |
          TOP=corona_compute_${{ matrix.cell }}_ax7203
          mkdir -p build/fmtcost
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog fpga/openxc7-synth/${TOP}.v fpga/openxc7-synth/gf_adder_param.v fpga/openxc7-synth/gf_mul_param.v;
            synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7 -top ${TOP};
            setundef -zero -params; write_json build/fmtcost/${TOP}.json" 2>&1 | tee /tmp/yosys_nocarry.log
          grep -E "Estimated|ERROR" /tmp/yosys_nocarry.log
          ! grep -q "ERROR" /tmp/yosys_nocarry.log
      - name: Yosys (control, carry allowed)
        run: |
          TOP=corona_compute_${{ matrix.cell }}_ax7203
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog fpga/openxc7-synth/${TOP}.v fpga/openxc7-synth/gf_adder_param.v fpga/openxc7-synth/gf_mul_param.v;
            synth_xilinx -flatten -abc9 -nodsp -arch xc7 -top ${TOP};
            setundef -zero -params" 2>&1 | tee /tmp/yosys_carry.log
          grep -E "Estimated|ERROR" /tmp/yosys_carry.log
          ! grep -q "ERROR" /tmp/yosys_carry.log
      - uses: actions/cache@v4
        id: chipdb
        with:
          path: build/fmtcost/chipdb/xc7a200tfbg484-2.bin
          key: chipdb-xc7a200tfbg484-2-regymm-${{ github.run_id }}
          restore-keys: chipdb-xc7a200tfbg484-2-regymm-
      - if: steps.chipdb.outputs.cache-hit != 'true'
        name: Build chipdb
        run: |
          mkdir -p build/fmtcost/chipdb
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device xc7a200tfbg484-2 --bba /work/build/fmtcost/chipdb/xc7a200tfbg484-2.bba && bbasm -l /work/build/fmtcost/chipdb/xc7a200tfbg484-2.bba /work/build/fmtcost/chipdb/xc7a200tfbg484-2.bin"
      - name: nextpnr (seed search)
        run: |
          TOP=corona_compute_${{ matrix.cell }}_ax7203
          # CORRECTED 2026-09-06. This cascade was added because gf8_mul failed on
          # $PACKER_GND_NET with heap+router1, attributed here to a constant
          # pseudo-net bug in nextpnr-xilinx and explicitly not to congestion
          # (~237 LUT on a 200T part). The congestion half was right; the cause
          # was not the router. Yosys was inferring DSP48E1 because -nodsp was
          # missing from synth_xilinx. With the flag added, run 34016575130 routed
          # gf8_mul at heap/router1/seed1 -- the first config, the first seed.
          #
          # The cascade is KEPT, not deleted: it breaks out on first success, so
          # it costs nothing when the first configuration works, and it is a real
          # safety net if a future core genuinely needs another placer or router.
          # But it is no longer load-bearing for gf8_mul, and the sa+router1
          # post-placement validity note below was observed under the same
          # DSP-inferred netlist and should be re-checked before being trusted.
          CLEAN=0
          for CFG in "heap router1" "heap router2" "sa router2"; do
            set -- $CFG; P=$1; R=$2
            for s in 1 2 3 4 5 6; do
              rm -f build/fmtcost/${TOP}_routed.json
              docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 timeout --signal=KILL 1800 nextpnr-xilinx \
                --chipdb /work/build/fmtcost/chipdb/xc7a200tfbg484-2.bin \
                --xdc /work/fpga/openxc7-synth/corona_decode_ax7203.xdc \
                --json /work/build/fmtcost/${TOP}.json \
                --write /work/build/fmtcost/${TOP}_routed.json \
                --freq 50.0 --seed $s --placer $P --router $R --timing-allow-fail > /tmp/np_${P}_${R}_$s.log 2>&1 || true
              if grep -q "Failed to find a route" /tmp/np_${P}_${R}_$s.log || [ ! -f build/fmtcost/${TOP}_routed.json ]; then continue; fi
              cp /tmp/np_${P}_${R}_$s.log /tmp/np.log; CLEAN="$P/$R/seed$s"; break 2
            done
          done
          if [ "$CLEAN" = "0" ]; then
            echo "::error::no clean seed"
            for f in /tmp/np_*.log; do
              echo "===== $f (errors) ====="; grep -iE "^ERROR|error|fatal|Failed" "$f" | head -10
              echo "===== $f (tail) ====="; tail -25 "$f"
            done
            exit 1
          fi; echo "seed=$CLEAN"
      - name: Extract metrics
        run: |
          mkdir -p metrics
          {
            echo "cell=${{ matrix.cell }}"
            echo "lc_nocarry=$(grep -oE 'Estimated number of LCs: *[0-9]+' /tmp/yosys_nocarry.log | grep -oE '[0-9]+' | tail -1)"
            echo "lc_carry=$(grep -oE 'Estimated number of LCs: *[0-9]+' /tmp/yosys_carry.log | grep -oE '[0-9]+' | tail -1)"
            echo "fmax=$(grep -E 'Max frequency for clock' /tmp/np.log | tail -1 | sed 's/^.*: //')"
            echo "luts=$(grep -E 'SLICE_LUTX' /tmp/np.log | tail -1 | grep -oE '[0-9]+/' | head -1 | tr -d /)"
            echo "ffs=$(grep -E 'SLICE_FFX' /tmp/np.log | tail -1 | grep -oE '[0-9]+/' | head -1 | tr -d /)"
          } | tee metrics/${{ matrix.cell }}.txt
      - uses: actions/upload-artifact@v4
        with: {name: 'fmtcost-${{ matrix.cell }}', path: 'metrics/${{ matrix.cell }}.txt'}

  report:
    needs: synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'fmtcost-*', merge-multiple: true, path: metrics}
      - name: Assemble table
        run: |
          {
            echo "## Формат-абляция цены на xc7a200tfbg484-2 [измерено CI-synth]"
            echo ""
            echo "Идентичная UART-обёртка у всех плеч; разница = разница ядер."
            echo ""
            echo "| Ячейка | LC (nocarry) | LC (carry) | LUT (P&R) | FF (P&R) | Fmax |"
            echo "|---|---|---|---|---|---|"
            for f in metrics/*.txt; do
              . <(sed 's/^/m_/' "$f")
              echo "| ${m_cell} | ${m_lc_nocarry:-?} | ${m_lc_carry:-?} | ${m_luts:-?} | ${m_ffs:-?} | ${m_fmax:-?} |"
            done
          } | tee fmtcost_table.md
          cat fmtcost_table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: fmtcost-table, path: fmtcost_table.md}
