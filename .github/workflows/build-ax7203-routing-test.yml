name: Build AX7203 (Routing Experiment)
on:
  workflow_dispatch:
    inputs:
      design:
        description: 'Design module name'
        required: true
        default: 'corona_compute_gf8_mul_ax7203'
      yosys_opts:
        description: 'Yosys synth options (try: -nocarry -arch xc7 WITHOUT -abc9)'
        required: true
        default: '-nocarry -arch xc7'
      placer:
        description: 'nextpnr placer (sa or heap)'
        required: true
        default: 'sa'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - id: chipdb
        uses: ./.github/actions/openxc7-chipdb
        with:
          part: xc7a200tfbg484-2
          out: chipdb-xc7a200tfbg484-2.bin
          image: regymm/openxc7:latest
      - name: Build with custom options
        run: |
          DESIGN="${{ github.event.inputs.design }}"
          YOSYS_OPTS="${{ github.event.inputs.yosys_opts }}"
          PLACER="${{ github.event.inputs.placer }}"
          docker run --rm -v "$(pwd):/github" -e DESIGN="$DESIGN" -e YOSYS_OPTS="$YOSYS_OPTS" -e PLACER="$PLACER" regymm/openxc7:latest bash -c '
          cd /github/fpga/openxc7-synth
          echo "=== yosys: synth_xilinx $YOSYS_OPTS ==="
          yosys -q -p "read_verilog gf_adder_param.v gf_mul_param.v ${DESIGN}.v; synth_xilinx ${YOSYS_OPTS}; write_json ${DESIGN}.json" || exit 1
          echo "=== nextpnr: placer=$PLACER ==="
          cp /github/chipdb-xc7a200tfbg484-2.bin /chipdb/xc7a200tfbg484-2.bin
          nextpnr-xilinx --chipdb /chipdb/xc7a200tfbg484-2.bin --json ${DESIGN}.json --xdc ax7203_corona.xdc --fasm ${DESIGN}.fasm --placer ${PLACER} --router router1 --timing-allow-fail --freq 5 || exit 1
          echo "=== ROUTING SUCCESS ==="
          /prjxray/env/bin/fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 ${DESIGN}.fasm ${DESIGN}.frames 2>/dev/null
          xc7frames2bit --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml --frm_file ${DESIGN}.frames --output_file ${DESIGN}.bit
          ls -la ${DESIGN}.bit'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.design }}_routing_test
          path: fpga/openxc7-synth/${{ github.event.inputs.design }}.bit
