name: Document references

# Enumerating every pair of artefacts that must agree showed all existing gates
# are code against code, and that every pair with a DOCUMENT on one side was
# unguarded. A document naming a file, a script or a gate makes a checkable claim
# about the tree, and a path in prose does not update itself when the tree moves.
#
# Ratcheted both ways: historical dangling references are baselined in
# tools/doc_refs_baseline.txt, the job fails on a new one, and it fails on a
# baseline entry that no longer reproduces (prune it with --prune-baseline),
# so a fixed reference cannot rot again in silence. Temporary paths,
# sibling-repository paths, and files a document names precisely to record
# their absence are excluded explicitly.
#
# THE SIBLINGS. check_doc_refs.py resolves references against sibling checkouts
# next to this repository -- t27, trinity-s3ai, claim-audit-lab, tri-net,
# trios-mesh, zig-golden-float -- and its own comment says why their absence is
# a problem: a checkout without them cannot tell them from rot.
#
# So the baseline could only ever be generated somewhere the siblings exist, and
# CI reported the difference as failures. Five of the six are public and are
# now materialised below. The sixth, trios-mesh, is private: no arrangement of
# this workflow can reach it with the default token, so references that resolve
# only there remain unverifiable here. That is stated rather than hidden.
#
# NAMES ONLY, NOT CONTENT: see tools/materialise_siblings.sh, which both this
# workflow and gates-can-fail.yml call.

on:
  pull_request:
  push:
    branches: [main, master]

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: trinity-fpga

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # One script for both workflows that need the siblings (this one and
      # gates-can-fail.yml); it reads the list from check_doc_refs.py itself.
      - name: Materialise the sibling namespaces
        working-directory: ${{ github.workspace }}
        run: bash trinity-fpga/tools/materialise_siblings.sh

      - name: Check
        working-directory: ${{ github.workspace }}/trinity-fpga
        run: python3 tools/check_doc_refs.py
