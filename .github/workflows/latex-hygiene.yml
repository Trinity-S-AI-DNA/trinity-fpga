name: LaTeX hygiene

# Defects LaTeX resolves silently. Four duplicate \label definitions sent twelve
# \ref commands to the wrong theorems and tables while the build reported zero
# errors and zero undefined references.

on: [pull_request, push]

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latex-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/check_latex_hygiene.py
