# ALINX AX7203 GF16 Codec + UART Conformance Bitstream
# Runs openXC7 toolchain (Yosys + nextpnr + fasm2frames + xc7frames2bit)
# on x86_64 Ubuntu runner in GitHub Actions.
#
# Target: xc7a200tfbg484-2 (Artix-7 200T, speed grade -2)
# Source files:
#   - fpga/vivado/gf16_codec_ax7203.v
#   - fpga/openxc7-synth/gf16_adder.v
#   - specs/fpga/constraints/gf16_ax7203.xdc
#
# Trigger: workflow_dispatch (manual) or push to GF16 RTL/XDC.
# Artifact: gf16_codec_ax7203.bit

# NOTE ON SCOPE. This builds gf16_adder.v, whose own header describes a
# "GF16 format (15 bits + sign)" with an 8-bit mantissa and "bias TBD" -- an
# AX7203 bring-up variant, not the catalog's gf16 (1+6E+9M, bias 31). No Tier-E
# proof cites this workflow: the gf16 ADD, SUB and MUL proofs cite
# "AX7203 GF16 Clean Conformance", "AX7203 GF16 SUB Conformance" and
# "AX7203 GF16 MUL Clean Conformance", which build gf_adder_param.v and
# gf_mul_param.v. The name below is older than that split.
name: AX7203 GF16 Conformance Bitstream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpga/vivado/gf16_codec_ax7203.v'
      # These now name what the job actually compiles. They previously listed
      # gf16_add.v and gf16_mul.v, which this workflow has never read: a change
      # to either triggered a build that ignored it and went green regardless.
      - 'fpga/vivado/gf16_codec_ax7203.v'
      - 'fpga/openxc7-synth/gf16_adder.v'
      - 'specs/fpga/constraints/gf16_ax7203.xdc'
      - '.github/workflows/ax7203-gf16-conformance.yml'

jobs:
  bitstream:
    name: Generate AX7203 GF16 Codec Bitstream
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Pull openXC7 Docker image
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }

      - name: Yosys synthesis
        run: |
          mkdir -p build/ax7203_gf16
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            yosys -p "
              read_verilog fpga/vivado/gf16_codec_ax7203.v fpga/openxc7-synth/gf16_adder.v;
              synth_xilinx -flatten -abc9 -nocarry -arch xc7 -top gf16_codec_ax7203;
              setundef -zero -params;
              write_json build/ax7203_gf16/gf16_codec_ax7203.json
            " 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated number of LCs|ERROR" /tmp/yosys.log

      - id: chipdb-cache
        uses: ./.github/actions/openxc7-chipdb
        with:
          part: xc7a200tfbg484-2
          out: build/ax7203_gf16/chipdb/xc7a200tfbg484-2.bin

      - name: nextpnr place and route (seed search for a clean $PACKER_VCC_NET route)
        run: |
          # nextpnr-xilinx on xc7a200t can leave $PACKER_VCC_NET unrouted; NO
          # --force (a bad seed must fail, not ship a broken bitstream). Search
          # seeds 1..8, accept the first clean route (same pattern as
          # uart_tx_probe / loopback / dual_clk_heartbeat).
          CLEAN=0
          for s in 1 2 3 4 5 6 7 8; do
            echo "::group::nextpnr seed $s"
            rm -f build/ax7203_gf16/gf16_codec_ax7203.fasm
            docker run --rm \
              -v "$PWD:/work" -w /work \
              regymm/openxc7 \
              nextpnr-xilinx \
                --chipdb /work/build/ax7203_gf16/chipdb/xc7a200tfbg484-2.bin \
                --xdc /work/specs/fpga/constraints/gf16_ax7203.xdc \
                --json /work/build/ax7203_gf16/gf16_codec_ax7203.json \
                --write /work/build/ax7203_gf16/gf16_codec_ax7203_routed.json \
                --fasm /work/build/ax7203_gf16/gf16_codec_ax7203.fasm \
                --freq 50.0 --seed $s --placer sa --router router1 --timing-allow-fail > /tmp/nextpnr_$s.log 2>&1 || true
            echo "::endgroup::"
            if grep -q "Failed to find a route" /tmp/nextpnr_$s.log || [ ! -f build/ax7203_gf16/gf16_codec_ax7203.fasm ]; then
              echo "seed $s: unrouted \$PACKER_VCC_NET (or no fasm) — rejecting"
              continue
            fi
            echo "seed $s: CLEAN route — accepted"
            cp /tmp/nextpnr_$s.log /tmp/nextpnr.log
            CLEAN=$s
            break
          done
          if [ "$CLEAN" = "0" ]; then
            echo "::error::no seed in 1..8 routed cleanly (all hit unrouted \$PACKER_VCC_NET)"
            exit 1
          fi
          echo "Accepted nextpnr seed: $CLEAN"
          grep -E "Max frequency|Info: Device utilisation" /tmp/nextpnr.log || true

      - name: fasm2frames + xc7frames2bit
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            bash -c "
              source /prjxray/env/bin/activate && \
              fasm2frames \
                --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 \
                --part xc7a200tfbg484-2 \
                /work/build/ax7203_gf16/gf16_codec_ax7203.fasm \
                /work/build/ax7203_gf16/gf16_codec_ax7203.frames && \
              /prjxray/build/tools/xc7frames2bit \
                --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml \
                --part_name xc7a200tfbg484-2 \
                --frm_file /work/build/ax7203_gf16/gf16_codec_ax7203.frames \
                --output_file /work/build/ax7203_gf16/gf16_codec_ax7203.bit
            "

      - name: Verify bitstream
        run: |
          ls -lh build/ax7203_gf16/gf16_codec_ax7203.bit
          file build/ax7203_gf16/gf16_codec_ax7203.bit

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: ax7203-gf16-bitstream
          path: |
            build/ax7203_gf16/gf16_codec_ax7203.bit
            build/ax7203_gf16/gf16_codec_ax7203.fasm
          retention-days: 30
