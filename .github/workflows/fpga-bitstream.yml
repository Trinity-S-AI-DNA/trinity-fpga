# ═══════════════════════════════════════════════════════════════════════════════
# AUTOMATED BITSTREAM GENERATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Generates bitstreams when .tri specs change.
# (Renamed from .vibee in 7ed113c3c. The paths: filter was corrected in #751;
#  these body references were missed, and the workflow then found zero specs.)
# Uploads bitstreams as artifacts for hardware testing.
#
# Note: Full synthesis requires Docker with openXC7 toolchain.
# This workflow validates the pipeline without requiring hardware.
#
# φ² + 1/φ² = 3 = TRINITY
#
# ═══════════════════════════════════════════════════════════════════════════════

name: FPGA Bitstream Generation

on:
  push:
    branches: [main]
    paths:
      # `**/` requires a directory level, and every .tri here sits directly
      # in specs/fpga -- so the `**` form matched nothing and was the reason
      # this workflow could not fire at all. Only the live form is listed:
      # a pattern that matches nothing today is indistinguishable from one
      # that has rotted, which is the defect this whole change is fixing.
      # Add the `**` form when specs/fpga actually gains subdirectories.
      - 'specs/fpga/*.tri'
      - '.github/workflows/fpga-bitstream.yml'
  pull_request:
    branches: [main]
    paths:
      # `**/` requires a directory level, and every .tri here sits directly
      # in specs/fpga -- so the `**` form matched nothing and was the reason
      # this workflow could not fire at all. Only the live form is listed:
      # a pattern that matches nothing today is indistinguishable from one
      # that has rotted, which is the defect this whole change is fixing.
      # Add the `**` form when specs/fpga actually gains subdirectories.
      - 'specs/fpga/*.tri'
      - '.github/workflows/fpga-bitstream.yml'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Specific spec to build (e.g., test_blink)'
        required: false
        type: string
      consciousness:
        description: 'Consciousness level'
        required: false
        type: choice
        options:
          - transcendent
          - enlightened
          - aware
          - conscious
          - awakening
          - dormant
        default: 'aware'

env:
  CONSCIOUSNESS_DEFAULT: 'aware'

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # EXTRACT CHANGED SPECS
  # ═══════════════════════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect Changed Specs
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.changed.outputs.specs }}
      specs_json: ${{ steps.changed.outputs.specs_json }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed .tri specs
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.spec }}" ]; then
            # Manual trigger with specific spec
            echo "specs=${{ inputs.spec }}" >> $GITHUB_OUTPUT
            echo "specs_json=$(printf '%s\n' "${{ inputs.spec }}" | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
            echo "count=1" >> $GITHUB_OUTPUT
          else
            # Only specs that TARGET Verilog. `vibee gen` emits for the target a
            # spec declares, so a spec with no `language:` line produces no .v and
            # the next step reports "Verilog not found".
            #
            # Measured when this job first became visible: 14 .tri under
            # specs/fpga, 10 declaring `language: varlog`, 4 declaring nothing --
            # mac, rmsnorm, synthesis, uart_test_workflow -- and those 4 were
            # exactly the 4 that failed. Building every .tri and expecting Verilog
            # from all of them was the bug; the 4 are not broken Verilog specs,
            # they are not Verilog specs.
            #
            # Filtered by content rather than by an exclude-list, so a spec that
            # gains or loses a target moves itself between the sets.
            is_verilog() { grep -qE '^[[:space:]]*language:[[:space:]]*varlog' "specs/fpga/$1.tri" 2>/dev/null; }

            changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep 'specs/fpga/.*\.tri$' | sed 's|specs/fpga/||' | sed 's|\.tri$||' | tr '\n' ' ')
            if [ -z "$changed" ]; then
              # Fallback: every spec
              changed=$(ls specs/fpga/*.tri 2>/dev/null | xargs -n1 basename | sed 's|\.tri$||' | tr '\n' ' ')
            fi

            specs=""
            skipped=""
            for s in $changed; do
              if is_verilog "$s"; then specs="$specs $s"; else skipped="$skipped $s"; fi
            done
            specs=$(echo $specs)
            # Named, never silent: a shrinking scope that nobody can see is the
            # defect this whole workflow has been demonstrating.
            [ -n "$skipped" ] && echo "::notice::skipped (no 'language: varlog'):$skipped"
            echo "specs=$specs" >> $GITHUB_OUTPUT
            # A JSON ARRAY, not a bare word list. See the matrix note below.
            echo "specs_json=$(printf '%s\n' $specs | jq -R . | jq -sc .)" >> $GITHUB_OUTPUT
            n=$(echo $specs | wc -w)
            echo "count=$n" >> $GITHUB_OUTPUT
            if [ "$n" -eq 0 ]; then
              # Loudly, here. An empty matrix marks the RUN failed while
              # attaching no failing job to it, so nothing appears in the
              # checks list and the red is invisible to every reviewer.
              echo "::error::No .tri specs found under specs/fpga -- nothing to build."
              ls -la specs/fpga 2>/dev/null || echo "specs/fpga does not exist"
              exit 1
            fi
          fi

      - name: Show detected specs
        run: |
          echo "Changed specs: ${{ steps.changed.outputs.specs }}"
          echo "Count: ${{ steps.changed.outputs.count }}"

  # ═══════════════════════════════════════════════════════════════════════════════
  # GENERATE VERILOG AND XDC
  # ═══════════════════════════════════════════════════════════════════════════════
  generate-artifacts:
    name: Generate Artifacts
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      matrix:
        # format('[{0}]', specs) built `[blink counter mac]` from a
        # space-separated list -- not valid JSON, so fromJson() failed and this
        # job never instantiated. GitHub then marked the RUN failed with no
        # failing job attached to it: `gh run view` showed every job success or
        # skipped, `--log-failed` printed nothing, and the workflow never
        # appeared in the PR checks list at all. Invisible for its whole life.
        # The detect step now emits a real JSON array via jq.
        spec: ${{ fromJson(needs.detect-changes.outputs.specs_json) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Dci=true

      - name: Generate Verilog
        run: |
          ./zig-out/bin/vibee gen specs/fpga/${{ matrix.spec }}.tri

      - name: Check outputs
        run: |
          if [ -f "var/trinity/output/fpga/${{ matrix.spec }}.v" ]; then
            echo "✓ Verilog generated"
            wc -l "var/trinity/output/fpga/${{ matrix.spec }}.v"
          else
            echo "✗ Verilog not found"
            exit 1
          fi

      - name: Upload Verilog
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.spec }}-verilog
          path: var/trinity/output/fpga/${{ matrix.spec }}.v


  # ═══════════════════════════════════════════════════════════════════════════════
  # DOCKER SYNTHESIS (OPTIONAL - requires self-hosted runner with Docker)
  # ═══════════════════════════════════════════════════════════════════════════════
  synthesize-bitstream:
    name: Synthesize Bitstream
    runs-on: ubuntu-latest
    needs: [detect-changes, generate-artifacts]
    if: false  # Disabled by default - enable with self-hosted runner
    strategy:
      matrix:
        spec: ${{ fromJson(needs.detect-changes.outputs.specs_json) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.spec }}-*
          path: fpga/openxc7-synth/

      - name: Prepare synthesis
        run: |
          cd fpga/openxc7-synth
          mv ${{ matrix.spec }}-verilog/${{ matrix.spec }}.v ./

      - name: Synthesize with Docker
        run: |
          cd fpga/openxc7-synth
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }
          ./synth.sh ${{ matrix.spec }}.v ${{ matrix.spec }}

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.spec }}-bitstream
          path: fpga/openxc7-synth/${{ matrix.spec }}.bit

  # ═══════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════════
  summary:
    name: Bitstream Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, generate-artifacts]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  BITSTREAM GENERATION SUMMARY"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "  Spec(s):        ${{ needs.detect-changes.outputs.specs }}"
          echo "  Count:          ${{ needs.detect-changes.outputs.count }}"
          echo "  Artifact gen:   ${{ needs.generate-artifacts.result }}"
          echo ""
          echo "  Artifacts available:"
          echo "    - Verilog source files"
          echo ""
          echo "φ² + 1/φ² = 3 = TRINITY"
          echo "═══════════════════════════════════════════════════════════"
