# Can the gates themselves fail?
#
# tools/check_gates_can_fail.py has existed in this repo, fully written, and been
# invoked by NOTHING. `git grep check_gates_can_fail` returns two hits, both
# inside the file itself. Meanwhile two of the gates it covers had already gone
# blind in production and were caught by hand instead:
#
#   - check_self_consistency passed a paper claiming "Ninety-nine retractions are
#     marked in place below" and again one claiming "Three" (pre-#649)
#   - check_paper_numbers ended in an unconditional sys.exit(0) (pre-#650)
#
# The instrument that would have caught both was sitting in tools/. This runs it.
#
# Measured before landing, on main's tree: 7 of 10 gates rejected their injected
# defect, 3 were UNTESTABLE because they were already red on a clean tree, and the
# script exited 0. So it was safe as a blocking gate from day one -- it was not
# added in the hope that it passes. Since #825 all 10 are testable (floor 10);
# check_tee_pipefail joined as the 11th, testable from its first commit.
#
# ## The coverage floor, and why it is not optional
#
# The script reports UNTESTABLE for any gate already failing on a clean tree, and
# still exits 0. That is the right call for it to make -- a red gate is a finding
# about the tree, not about the gate -- but it means this check DEGRADES SILENTLY:
# every gate that goes red drops out of the tested set, and the summary line stays
# green with a smaller and smaller denominator. Taken to its limit, ten red gates
# would produce "0 of 10 tested" and a pass.
#
# So the floor below is the actual gate. If fewer than MIN_TESTABLE gates can be
# tested, this job fails and names the drop. The floor now equals the number of
# gates, so a gate ADDED to the harness must raise it in the same PR -- otherwise
# that gate, or any other, can drop out unnoticed. Never lower it to make a red
# build green.
#
# phi^2 + 1/phi^2 = 3 = TRINITY

name: Gates can fail

on:
  push:
    paths:
      - 'tools/check_*.py'
      - 'tools/materialise_siblings.sh'
      - 'research/arxiv_tnf/**'
      - '.github/workflows/gates-can-fail.yml'
  pull_request:
    paths:
      - 'tools/check_*.py'
      - 'tools/materialise_siblings.sh'
      - 'research/arxiv_tnf/**'
      - '.github/workflows/gates-can-fail.yml'
  workflow_dispatch:

env:
  # First measured on main at f32467d4f (floor 7). Ratchet upward only.
  # 7 -> 8: check_orphan_artefacts became testable once main's orphan list
  # was answered, and it rejects its defect now that gates no longer count
  # as producers of the files they name, and a producer's f-string prefix
  # must start a name ("corona_decode_{" no longer produces "decoder_*.json",
  # nor "lineD_actgate_{" every "gate_*.json").
  # 8 -> 9: check_doc_refs became testable once this job materialised the
  # sibling namespaces it resolves against (tools/materialise_siblings.sh, the
  # same script doc-refs.yml runs). Without them it was red on a clean tree.
  # 9 -> 10: check_withdrawn_live became testable once the paper marked the
  # withdrawn 0.1797 MHz/LUT cell in tab:fullthroughput (#820). It was red on
  # main for that one cell, so the harness could not plant its defect.
  # 10 -> 11: check_tee_pipefail added to the harness, green on main from its
  # first commit (its known steps sit in tools/tee_pipefail_baseline.txt).
  # 11 -> 12: check_concurrency_groups added to the harness, green from its
  # first commit, which also gave the 102 ungrouped workflows a group (#870).
  MIN_TESTABLE: '12'

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates-can-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # the gitlink is unfetchable; see README

      # check_doc_refs resolves references against sibling repositories next to
      # this checkout. Without them it is red on a clean tree, and a gate that is
      # red before its defect is injected cannot be shown to fail.
      - name: Materialise the sibling namespaces
        run: bash tools/materialise_siblings.sh

      # check_tee_pipefail and check_concurrency_groups read workflows with
      # PyYAML; without it each says "cannot tell" on a clean tree, and could
      # not be shown to fail.
      - name: PyYAML for the workflow gates
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --user --break-system-packages pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Every gate must reject its own defect
        run: |
          set -o pipefail
          # tee-pipefail: no shell of its own; `bash -e` below is only named in a comment
          # The step shell is `bash -e`: with pipefail a failing harness would end
          # the step on the pipe itself, before the message below. `|| rc=$?`
          # keeps the verdict and lets the step say WHY it is red (planted: a
          # harness printing FAIL and exiting 1 gave rc 1 with no ::error:: line).
          rc=0
          python3 tools/check_gates_can_fail.py 2>&1 | tee gates.log || rc=$?
          echo

          # The script's own verdict comes first: a gate that PASSES a defect it
          # is supposed to catch is the finding this file exists for.
          if [ "$rc" -ne 0 ]; then
            echo "::error::A gate accepted the defect it exists to catch. See the log above."
            exit "$rc"
          fi

          # Then the floor. Parse the summary line: "gates tested: N of M".
          tested=$(sed -n 's/^gates tested: \([0-9]\{1,\}\) of [0-9]\{1,\}$/\1/p' gates.log | head -1)
          if [ -z "$tested" ]; then
            echo "::error::Could not read the 'gates tested: N of M' summary line."
            echo "The script's output format changed, so the coverage floor is not being"
            echo "enforced -- which is exactly the silent degradation this floor exists to"
            echo "prevent. Fix the parse, do not delete the check."
            exit 1
          fi

          echo "testable gates: $tested (floor: $MIN_TESTABLE)"
          if [ "$tested" -lt "$MIN_TESTABLE" ]; then
            echo "::error::Only $tested gate(s) could be tested; the floor is $MIN_TESTABLE."
            echo "A gate becomes UNTESTABLE when it is already red on a clean tree, so this"
            echo "means the tree got worse, not that this check got stricter. The script"
            echo "would have exited 0 regardless -- that is why this floor is here."
            grep 'UNTESTABLE' gates.log || true
            exit 1
          fi
          # A ratchet that is not raised is a ratchet with slack: with 10 testable
          # and a floor of 9, one gate could drop out unnoticed. 9 -> 10 (#825)
          # was spotted by hand; say it here instead. A warning, not an error: a
          # gate that just went testable should not turn its own fix red.
          if [ "$tested" -gt "$MIN_TESTABLE" ]; then
            echo "::warning::$tested gates are testable but the floor is $MIN_TESTABLE -- raise MIN_TESTABLE to $tested."
          fi
