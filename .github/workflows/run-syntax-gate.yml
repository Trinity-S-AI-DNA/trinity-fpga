name: Run syntax gate

# Every `run:` script must parse. Two workflow_dispatch-only steps failed on
# parse each time they were dispatched, and nothing said so until one was run:
# an apostrophe in a comment inside `bash -c '...'` (build-matrix) and a `'\''`
# used outside single quotes (iddr-golden-diff). See tools/check_run_syntax.py.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/check_run_syntax.py'
      - 'tools/test_check_run_syntax.py'
      - 'tools/run_syntax_fixtures/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/check_run_syntax.py'
      - 'tools/test_check_run_syntax.py'
      - 'tools/run_syntax_fixtures/**'
  workflow_dispatch:

jobs:
  run-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # No history needed: the self-test's two inputs from e6eac090 are
          # files in tools/run_syntax_fixtures/, pinned by blob id.
          submodules: false
      - name: The gate rejects what it exists to catch
        run: python3 tools/test_check_run_syntax.py
      - name: Every run script parses
        run: python3 tools/check_run_syntax.py
