name: Reference kinds

# A \ref can exist, be unique, and still be wrong: the paper said
# "Appendix~\ref{sec:limits}" in a document with no appendix, and
# "Section~\ref{sec:blockrelated}" inside the section labelled sec:blockrelated.
# LaTeX resolves both silently and correctly by its own rules; the sentence is
# what is wrong, and the sentence names the kind.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ref-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tools/check_ref_kinds.py
