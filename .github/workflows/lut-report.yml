name: LUT Report

on:
  push:
    branches: [main]
    paths:
      - 'fpga/openxc7-synth/gf_adder_param.v'
      - 'fpga/openxc7-synth/gf_mul_param.v'
      - '.github/workflows/lut-report.yml'
      # the scripts this job runs: fixing a check must re-run it
      - 'fpga/openxc7-synth/run_synth.py'
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  yosys-synth:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate wrapper Verilog files
        run: |
          mkdir -p /tmp/wrappers
          for spec in GF4:1:2 GF8:3:4 GF12:4:7 GF14:5:8 GF16:6:9 GF20:7:12; do
            IFS=: read name eb mb <<< "$spec"
            w=$((1 + eb + mb))
            bias=$(((1 << (eb - 1)) - 1))
            cat > /tmp/wrappers/${name}_add.v << EOF
          module top(input clk, input rst, input in_valid,
              input [$((w-1)):0] in_a, input [$((w-1)):0] in_b, output in_ready,
              output reg out_valid, output reg [$((w-1)):0] out_y, input out_ready);
            gf_adder_param #(.EXP_BITS(${eb}),.MANT_BITS(${mb}),.TOTAL(${w}),.BIAS(${bias}),.HAS_INF(0)) u(
              .clk(clk),.rst(rst),.in_valid(in_valid),.in_a(in_a),.in_b(in_b),
              .in_ready(in_ready),.out_valid(out_valid),.out_y(out_y),.out_ready(out_ready));
          endmodule
          EOF
            cat > /tmp/wrappers/${name}_mul.v << EOF
          module top(input clk, input rst, input in_valid,
              input [$((w-1)):0] in_a, input [$((w-1)):0] in_b, output in_ready,
              output reg out_valid, output reg [$((w-1)):0] out_y, input out_ready);
            gf_mul_param #(.EXP_BITS(${eb}),.MANT_BITS(${mb}),.TOTAL(${w}),.BIAS(${bias}),.HAS_INF(0)) u(
              .clk(clk),.rst(rst),.in_valid(in_valid),.in_a(in_a),.in_b(in_b),
              .in_ready(in_ready),.out_valid(out_valid),.out_y(out_y),.out_ready(out_ready));
          endmodule
          EOF
          done

      - name: Synthesize in Docker (yosys 0.63)
        run: |
          mkdir -p lut_reports
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -v /tmp/wrappers:/wrappers \
            regymm/openxc7:latest \
            bash -c 'cd /work && python3 fpga/openxc7-synth/run_synth.py'

      - name: Upload LUT report
        uses: actions/upload-artifact@v4
        with:
          name: yosys-lut-report
          path: lut_reports/
