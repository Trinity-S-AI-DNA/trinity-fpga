# ALINX AX7203 Blinky Bitstream Generation
# Runs openXC7 toolchain (Yosys + nextpnr + fasm2frames + xc7frames2bit)
# on x86_64 Ubuntu runner in GitHub Actions.
#
# Target: xc7a200tfbg484-2 (Artix-7 200T, speed grade -2)
# Source files:
#   - fpga/vivado/blinky_ax7203.v
#   - specs/fpga/constraints/ax7203.xdc
#
# Trigger: workflow_dispatch (manual) or push to AX7203 RTL/XDC.
# Artifact: blinky_ax7203.bit
#
# phi^2 + 1/phi^2 = 3 = TRINITY

name: AX7203 Blinky Bitstream

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpga/vivado/blinky_ax7203.v'
      - 'specs/fpga/constraints/ax7203.xdc'
      - '.github/workflows/ax7203-blinky-bitstream.yml'

jobs:
  bitstream:
    name: Generate AX7203 Blinky Bitstream
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Pull openXC7 Docker image
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }

      - name: Yosys synthesis
        run: |
          mkdir -p build/ax7203_blinky
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            yosys -p "
              read_verilog fpga/vivado/blinky_ax7203.v;
              synth_xilinx -flatten -abc9 -arch xc7 -top blinky_ax7203;
              setundef -zero -params;
              write_json build/ax7203_blinky/blinky_ax7203.json
            " 2>&1 | tee /tmp/yosys.log
          grep "Estimated number of LCs" /tmp/yosys.log

      - id: chipdb-cache
        uses: ./.github/actions/openxc7-chipdb
        with:
          part: xc7a200tfbg484-2
          out: build/ax7203_blinky/chipdb/xc7a200tfbg484-2.bin

      - name: nextpnr place and route
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            nextpnr-xilinx \
              --chipdb /work/build/ax7203_blinky/chipdb/xc7a200tfbg484-2.bin \
              --xdc /work/specs/fpga/constraints/ax7203.xdc \
              --json /work/build/ax7203_blinky/blinky_ax7203.json \
              --write /work/build/ax7203_blinky/blinky_ax7203_routed.json \
              --fasm /work/build/ax7203_blinky/blinky_ax7203.fasm \
              --freq 100.0 --seed 1 --placer sa --router router1 --timing-allow-fail --force 2>&1 | tee /tmp/nextpnr.log
          grep "Max frequency" /tmp/nextpnr.log || true

      - name: fasm2frames + xc7frames2bit
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            bash -c "
              source /prjxray/env/bin/activate && \
              fasm2frames \
                --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 \
                --part xc7a200tfbg484-2 \
                /work/build/ax7203_blinky/blinky_ax7203.fasm \
                /work/build/ax7203_blinky/blinky_ax7203.frames && \
              /prjxray/build/tools/xc7frames2bit \
                --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml \
                --part_name xc7a200tfbg484-2 \
                --frm_file /work/build/ax7203_blinky/blinky_ax7203.frames \
                --output_file /work/build/ax7203_blinky/blinky_ax7203.bit
            "

      - name: Verify bitstream
        run: |
          ls -lh build/ax7203_blinky/blinky_ax7203.bit
          file build/ax7203_blinky/blinky_ax7203.bit

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: ax7203-blinky-bitstream
          path: |
            build/ax7203_blinky/blinky_ax7203.bit
            build/ax7203_blinky/blinky_ax7203.fasm
          retention-days: 30

      - name: Upload synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax7203-blinky-synthesis-reports
          path: |
            /tmp/yosys.log
            /tmp/nextpnr.log
          retention-days: 7
