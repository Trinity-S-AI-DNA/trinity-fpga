name: Build AX7203 Bitstream (Full openXC7)
on:
  workflow_dispatch:
    inputs:
      design:
        description: 'Design module name (e.g. corona_compute_gf16_add_ax7203)'
        required: true
        default: 'corona_compute_gf16_add_ax7203'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - id: chipdb
        uses: ./.github/actions/openxc7-chipdb
        with:
          part: xc7a200tfbg484-2
          out: chipdb-xc7a200tfbg484-2.bin
          image: regymm/openxc7:latest

      - name: Full bitstream build
        run: |
          DESIGN="${{ github.event.inputs.design }}"
          echo "Building $DESIGN..."
          docker run --rm \
            -v "$(pwd):/github" \
            -e DESIGN="$DESIGN" \
            regymm/openxc7:latest bash -c '
            cd /github/fpga/openxc7-synth
            echo "=== Step 1: Yosys ==="
            yosys -p "read_verilog gf_adder_param.v gf_mul_param.v gf_quire_param.v gf16_plus_mac.v ${DESIGN}.v; synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7; write_json ${DESIGN}.json" || exit 1
            echo "=== Step 2: nextpnr ==="
            cp /github/chipdb-xc7a200tfbg484-2.bin /chipdb/xc7a200tfbg484-2.bin
            nextpnr-xilinx --chipdb /chipdb/xc7a200tfbg484-2.bin \
              --json ${DESIGN}.json \
              --xdc ax7203_corona.xdc \
              --fasm ${DESIGN}.fasm \
              --router router1 \
              --timing-allow-fail \
              --freq 10.0 || exit 1
            echo "FASM lines: $(wc -l < ${DESIGN}.fasm)"
            echo "=== Step 3: fasm2frames ==="
            /prjxray/env/bin/fasm2frames \
              --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 \
              --part xc7a200tfbg484-2 \
              ${DESIGN}.fasm ${DESIGN}.frames 2>/dev/null
            echo "fasm2frames done, frames lines: $(wc -l < ${DESIGN}.frames)"
            [ -s ${DESIGN}.frames ] || exit 1
            echo "=== Step 4: xc7frames2bit ==="
            xc7frames2bit \
              --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml \
              --frm_file ${DESIGN}.frames \
              --output_file ${DESIGN}.bit
            echo "xc7frames2bit rc=$?"
            ls -la ${DESIGN}.bit || exit 1
            echo "=== BITSTREAM DONE ==="
            '

      - name: Upload FASM + JSON (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug_intermediates
          path: |
            fpga/openxc7-synth/*.fasm
            fpga/openxc7-synth/*.json

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.design }}_bitstream
          path: fpga/openxc7-synth/${{ github.event.inputs.design }}.bit
