name: Decode RTL exhaustive verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # This job builds only from the corona submodule; there are no
      # *_decode.v files in fpga/openxc7-synth, so the glob that used to sit
      # here matched nothing at all. Note that `paths:` filters on changes in
      # THIS repository, so edits inside the submodule are invisible from here --
      # only a pointer bump can be watched, and that is what this line does.
      - 'external/tt-trinity-corona'
      - 'fpga/openxc7-synth/binary16_decode.v'
      - 'conformance/decode_verify.py'
      - 'formal/decode_tb.v'
      - 'formal/binary16_decode_tb.v'
      - 'formal/fp8_e5m2_decode_tb.v'
      - '.github/workflows/decode-verify.yml'
# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: iverilog version
        run: iverilog -V 2>&1 | head -1
      - name: Compile + exhaustive-verify decode RTL (8 formats)
        run: |
          set -eo pipefail
          iverilog -g2012 -o /tmp/dec.vvp formal/decode_tb.v \
            external/tt-trinity-corona/src/rtl/fp8_e4m3_fnuz_decode.v external/tt-trinity-corona/src/rtl/fp6_e2m3_decode.v \
            external/tt-trinity-corona/src/rtl/fp6_e3m2_decode.v external/tt-trinity-corona/src/rtl/fp4_decode.v \
            external/tt-trinity-corona/src/rtl/int4_decode.v external/tt-trinity-corona/src/rtl/posit8_decode.v \
            external/tt-trinity-corona/src/rtl/lns8_decode.v external/tt-trinity-corona/src/rtl/int8_decode.v
          vvp /tmp/dec.vvp | python3 conformance/decode_verify.py
      - name: binary16 (exhaustive 65536, struct 'e' oracle)
        run: |
          set -eo pipefail
          iverilog -g2012 -o /tmp/b16.vvp formal/binary16_decode_tb.v fpga/openxc7-synth/binary16_decode.v
          vvp /tmp/b16.vvp | python3 conformance/decode_verify.py --format binary16
      - name: fp8_e5m2 (exhaustive 256)
        run: |
          set -eo pipefail
          iverilog -g2012 -o /tmp/f8.vvp formal/fp8_e5m2_decode_tb.v external/tt-trinity-corona/src/rtl/fp8_e5m2_decode.v
          vvp /tmp/f8.vvp | python3 conformance/decode_verify.py --format fp8_e5m2
      - run: echo "DECODE RTL VERIFY PASS (10 formats)"
