name: AX7203 Corona Decode Conformance
on:
  workflow_dispatch:
    inputs:
      cell:
        description: >-
          Top module to build. The default is the cell this job has always built,
          so dispatching with no input keeps the previous behaviour exactly.
          corona_decode_posit8_es2_ax7203 builds the es=2 variant, whose format is
          the one the catalogue's posit8 pack declares.
        type: choice
        default: corona_decode_posit8_ax7203
        options:
          - corona_decode_posit8_ax7203
          - corona_decode_posit8_es2_ax7203
  push:
    branches: [main]
    paths:
      # These now name what the job compiles. They previously watched
      # corona_decode_top_ax7203.v and fpga/openxc7-synth/*_decode.v, neither of
      # which this workflow reads -- so a change to either triggered a build that
      # ignored it.
      - 'fpga/openxc7-synth/corona_decode_posit8_ax7203.v'
      - 'fpga/openxc7-synth/corona_decode_posit8_es2_ax7203.v'
      - 'fpga/openxc7-synth/posit8_es2_decode.v'
      - 'fpga/openxc7-synth/posit16_decode.v'
      # A path *inside* a submodule never appears in this repo's diff: git
      # reports the gitlink as a single entry. Watch the gitlink.
      - 'external/tt-trinity-corona'
      - 'fpga/openxc7-synth/corona_decode_ax7203.xdc'
      - '.github/workflows/ax7203-corona-decode.yml'
# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bitstream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Docker pull regymm/openxc7 (retry on transient 5xx)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }
      - name: Pick the cell
        id: cell
        run: |
          CELL="${{ github.event.inputs.cell }}"
          CELL="${CELL:-corona_decode_posit8_ax7203}"
          case "$CELL" in
            corona_decode_posit8_ax7203)
              SRC="fpga/openxc7-synth/corona_decode_posit8_ax7203.v external/tt-trinity-corona/src/rtl/posit8_decode.v" ;;
            corona_decode_posit8_es2_ax7203)
              SRC="fpga/openxc7-synth/corona_decode_posit8_es2_ax7203.v fpga/openxc7-synth/posit8_es2_decode.v fpga/openxc7-synth/posit16_decode.v" ;;
            *) echo "::error::unknown cell $CELL"; exit 1 ;;
          esac
          echo "top=$CELL"  >> "$GITHUB_OUTPUT"
          echo "src=$SRC"   >> "$GITHUB_OUTPUT"
          echo "Building $CELL from: $SRC"
      - name: Yosys
        run: |
          mkdir -p build/corona_decode
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog ${{ steps.cell.outputs.src }};
            synth_xilinx -flatten -abc9 -nocarry -arch xc7 -top ${{ steps.cell.outputs.top }};
            setundef -zero -params; write_json build/corona_decode/corona_decode_ax7203.json" 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated|ERROR" /tmp/yosys.log
      - uses: actions/cache@v4
        id: chipdb
        with:
          path: build/corona_decode/chipdb/xc7a200tfbg484-2.bin
          key: chipdb-xc7a200tfbg484-2-regymm-${{ github.run_id }}
          restore-keys: chipdb-xc7a200tfbg484-2-regymm-
      - if: steps.chipdb.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/corona_decode/chipdb
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device xc7a200tfbg484-2 --bba /work/build/corona_decode/chipdb/xc7a200tfbg484-2.bba && bbasm -l /work/build/corona_decode/chipdb/xc7a200tfbg484-2.bba /work/build/corona_decode/chipdb/xc7a200tfbg484-2.bin"
      - name: nextpnr (seed search)
        run: |
          CLEAN=0; for s in $(seq 1 8); do
            rm -f build/corona_decode/corona_decode_ax7203.fasm
            docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 timeout --signal=KILL 1800 nextpnr-xilinx \
              --chipdb /work/build/corona_decode/chipdb/xc7a200tfbg484-2.bin \
              --xdc /work/fpga/openxc7-synth/corona_decode_ax7203.xdc \
              --json /work/build/corona_decode/corona_decode_ax7203.json \
              --write /work/build/corona_decode/corona_decode_ax7203_routed.json \
              --fasm /work/build/corona_decode/corona_decode_ax7203.fasm \
              --freq 50.0 --seed $s --placer sa --router router1 --timing-allow-fail > /tmp/np_$s.log 2>&1 || true
            if grep -q "Failed to find a route" /tmp/np_$s.log || [ ! -f build/corona_decode/corona_decode_ax7203.fasm ]; then continue; fi
            cp /tmp/np_$s.log /tmp/np.log; CLEAN=$s; break
          done; [ "$CLEAN" = "0" ] && { echo "::error::no clean seed"; tail -n 15 /tmp/np_*.log; exit 1; }; echo "seed=$CLEAN"
      - name: fasm2bit
        run: |
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "
            source /prjxray/env/bin/activate && fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 /work/build/corona_decode/corona_decode_ax7203.fasm /work/build/corona_decode/corona_decode_ax7203.frames && /prjxray/build/tools/xc7frames2bit --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml --part_name xc7a200tfbg484-2 --frm_file /work/build/corona_decode/corona_decode_ax7203.frames --output_file /work/build/corona_decode/corona_decode_ax7203.bit"
      - uses: actions/upload-artifact@v4
        with:
          name: corona-decode-bitstream-${{ steps.cell.outputs.top }}
          path: build/corona_decode/corona_decode_ax7203.bit
