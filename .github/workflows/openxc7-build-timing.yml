# openXC7 build-time measurement
#
# Produces the number nobody has published with a method attached: how long the
# open toolchain takes to turn Verilog into a bitstream, on a stated machine,
# with stated boundaries.
#
# The boundaries are the point. Measured:
#     yosys synthesis + nextpnr place-and-route + fasm2frames + xc7frames2bit
# NOT measured:
#     docker pull, checkout, chipdb generation
# The chipdb is built once in a separate job and handed to every measurement job
# as an artifact, so it is identical across runs and outside the timed window.
# It is a property of the part, not of the design, and Vivado has no equivalent
# step — including it would flatter neither tool honestly.
#
# Five repeats per design, with the seed FIXED at 1. That is deliberate and it
# decides what the spread means: the input is identical every time, so the
# variation is the machine, not the placer. GitHub's shared runners have noisy
# neighbours, and on the first run blinky ranged 50.5s to 70.7s -- 40 per cent
# -- for byte-identical work. A single run would have reported a number a
# quarter away from the median with nothing to reveal it.
#
# Seed sensitivity is a different measurement and this workflow does not make
# it. Sweeping seeds would conflate two sources of variance in one column.
#
# The Vivado half of the comparison cannot run here — no license, no install.
# These designs are plain Verilog + XDC, so anyone with Vivado can build the
# same three and put their numbers beside these.
#
# phi^2 + 1/phi^2 = 3 = TRINITY

name: openXC7 build timing

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: 'Runs per design'
        required: false
        default: '5'

jobs:
  chipdb:
    name: chipdb xc7a200tfbg484-2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pull openXC7 image
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null

      - id: cache
        uses: ./.github/actions/openxc7-chipdb
        with:
          part: xc7a200tfbg484-2
          out: chipdb/xc7a200tfbg484-2.bin

      - name: Upload chipdb
        uses: actions/upload-artifact@v4
        with:
          name: chipdb
          path: chipdb/xc7a200tfbg484-2.bin
          retention-days: 1

  measure:
    name: ${{ matrix.design }} run ${{ matrix.run }}
    needs: chipdb
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        design: [blinky, gf12_mul, gf128_mul]
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Pull openXC7 image
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: chipdb
          path: chipdb

      - name: Record the machine
        run: |
          echo "cores=$(nproc)" | tee machine.txt
          echo "mem_kb=$(grep MemTotal /proc/meminfo | awk '{print $2}')" | tee -a machine.txt
          echo "model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)" | tee -a machine.txt

      - name: Select the design
        id: d
        run: |
          case "${{ matrix.design }}" in
            blinky)
              echo "src=fpga/vivado/blinky_ax7203.v"                     >> $GITHUB_OUTPUT
              echo "top=blinky_ax7203"                                   >> $GITHUB_OUTPUT
              echo "xdc=specs/fpga/constraints/ax7203.xdc"               >> $GITHUB_OUTPUT
              echo "synth=-flatten -abc9 -arch xc7"                      >> $GITHUB_OUTPUT
              echo "placer=sa"                                           >> $GITHUB_OUTPUT
              echo "freq=100.0"                                          >> $GITHUB_OUTPUT
              ;;
            gf128_mul)
              # Every design here is self-contained in this repository. The
              # corona *decoders* were the obvious third choice and are not
              # usable: their wrappers instantiate a core from the
              # external/tt-trinity-corona submodule, and checking submodules
              # out in CI fails outright — which took all fifteen jobs of one
              # run with it, including the two designs that never needed them.
              echo "src=fpga/openxc7-synth/gf_mul_param.v fpga/openxc7-synth/corona_compute_gf128_mul_ax7203.v" >> $GITHUB_OUTPUT
              echo "top=corona_compute_gf128_mul_ax7203"                 >> $GITHUB_OUTPUT
              echo "xdc=fpga/openxc7-synth/ax7203_corona.xdc"            >> $GITHUB_OUTPUT
              echo "synth=-flatten -abc9 -nocarry -nodsp -arch xc7"      >> $GITHUB_OUTPUT
              echo "placer=heap"                                         >> $GITHUB_OUTPUT
              echo "freq=5.0"                                            >> $GITHUB_OUTPUT
              ;;
            gf12_mul)
              # -nodsp is not optional here. Without it yosys infers DSP48E1
              # multipliers that nextpnr-xilinx cannot route, and the build dies
              # with "no clean seed" across every seed and placer. That was the
              # root cause of every GF MUL routing failure we have had.
              echo "src=fpga/openxc7-synth/gf_adder_param.v fpga/openxc7-synth/gf_mul_param.v fpga/openxc7-synth/corona_compute_gf12_mul_ax7203.v" >> $GITHUB_OUTPUT
              echo "top=corona_compute_gf12_mul_ax7203"                  >> $GITHUB_OUTPUT
              echo "xdc=fpga/openxc7-synth/ax7203_corona.xdc"            >> $GITHUB_OUTPUT
              echo "synth=-flatten -abc9 -nocarry -nodsp -arch xc7"      >> $GITHUB_OUTPUT
              echo "placer=heap"                                         >> $GITHUB_OUTPUT
              echo "freq=5.0"                                            >> $GITHUB_OUTPUT
              ;;
          esac
          mkdir -p out

      - name: Synthesis
        id: synth
        run: |
          S=$(date +%s%3N)
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 \
            yosys -q -p "read_verilog ${{ steps.d.outputs.src }}; synth_xilinx ${{ steps.d.outputs.synth }} -top ${{ steps.d.outputs.top }}; setundef -zero -params; write_json out/d.json"
          E=$(date +%s%3N)
          echo "ms=$((E-S))" >> $GITHUB_OUTPUT

      - name: Place and route
        id: pnr
        run: |
          S=$(date +%s%3N)
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 \
            nextpnr-xilinx \
              --chipdb /work/chipdb/xc7a200tfbg484-2.bin \
              --xdc /work/${{ steps.d.outputs.xdc }} \
              --json /work/out/d.json \
              --fasm /work/out/d.fasm \
              --freq ${{ steps.d.outputs.freq }} --seed 1 \
              --placer ${{ steps.d.outputs.placer }} --router router1 \
              --timing-allow-fail --force
          E=$(date +%s%3N)
          echo "ms=$((E-S))" >> $GITHUB_OUTPUT

      - name: Bitstream
        id: bit
        run: |
          S=$(date +%s%3N)
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "
            source /prjxray/env/bin/activate &&
            fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 \
              --part xc7a200tfbg484-2 /work/out/d.fasm /work/out/d.frames &&
            /prjxray/build/tools/xc7frames2bit \
              --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml \
              --part_name xc7a200tfbg484-2 --frm_file /work/out/d.frames \
              --output_file /work/out/d.bit
          "
          E=$(date +%s%3N)
          echo "ms=$((E-S))" >> $GITHUB_OUTPUT
          ls -l out/d.bit

      - name: Emit the measurement
        run: |
          SY=${{ steps.synth.outputs.ms }}
          PR=${{ steps.pnr.outputs.ms }}
          BI=${{ steps.bit.outputs.ms }}
          jq -n --arg design "${{ matrix.design }}" --argjson run ${{ matrix.run }} \
                --argjson synth $SY --argjson pnr $PR --argjson bit $BI \
                --argjson total $((SY+PR+BI)) \
                --arg cores "$(nproc)" \
                '{design:$design, run:$run, synth_ms:$synth, pnr_ms:$pnr, bit_ms:$bit, total_ms:$total, cores:($cores|tonumber)}' \
            > out/timing-${{ matrix.design }}-${{ matrix.run }}.json
          cat out/timing-${{ matrix.design }}-${{ matrix.run }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.design }}-${{ matrix.run }}
          path: out/timing-${{ matrix.design }}-${{ matrix.run }}.json
          retention-days: 30

  report:
    name: Median and spread
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: timing-*
          merge-multiple: true
          path: t

      - name: Aggregate
        run: |
          echo "## openXC7 build time" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Runner: \`ubuntu-latest\`, $(nproc) cores. Measured: synthesis + place-and-route + bitstream." >> $GITHUB_STEP_SUMMARY
          echo "Not measured: image pull, checkout, chipdb generation." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| design | n | median | min | max | synth | p&r | bit |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          jq -s -r '
            def med: sort | if length == 0 then 0
                            elif length % 2 == 1 then .[length/2|floor]
                            else ((.[length/2-1] + .[length/2]) / 2) end;
            def s(x): (x/1000*10|round)/10 | tostring + "s";
            group_by(.design)[]
            | { d: .[0].design, n: length,
                tot: [.[].total_ms], sy: [.[].synth_ms], pr: [.[].pnr_ms], bi: [.[].bit_ms] }
            | "| \(.d) | \(.n) | \(.tot|med|s(.)) | \(.tot|min|s(.)) | \(.tot|max|s(.)) | \(.sy|med|s(.)) | \(.pr|med|s(.)) | \(.bi|med|s(.)) |"
          ' t/*.json >> $GITHUB_STEP_SUMMARY || echo "no measurements collected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vivado has no numbers here: no license, no install. These designs are plain Verilog + XDC and can be built by anyone who has it." >> $GITHUB_STEP_SUMMARY
          cat $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: timings-all
          path: t
          retention-days: 90
