name: secret-scan

# Fails the build if a commit adds a credential (API key, token, password,
# Wi-Fi passphrase). Rules: .gitleaks.toml. Added after the 2026-10-05 cleanup,
# when a Wi-Fi password, a DeepSeek key, Kaggle tokens and a Telegram bot
# token were found committed in this public repository.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BASE..HEAD"
          fi
          gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="$RANGE" .
