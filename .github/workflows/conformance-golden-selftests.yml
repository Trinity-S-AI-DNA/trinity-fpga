name: Conformance golden self-tests

on:
  push:
    branches: [main]
    paths:
      - 'conformance/**_ref.py'
      - 'conformance/run_selftests.py'
      - '.github/workflows/conformance-golden-selftests.yml'
  pull_request:
    paths:
      - 'conformance/**_ref.py'
      - 'conformance/run_selftests.py'
      - '.github/workflows/conformance-golden-selftests.yml'
  workflow_dispatch:

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install oracle dependencies
        # gf_mx_ref imports numpy for block quantisation. Without this the gate
        # reports the oracle as FAILED on an ImportError, which looks like a
        # numeric defect and is not one -- the wrong kind of red.
        run: python3 -m pip install --quiet numpy
      - name: Run golden oracle self-tests
        run: |
          # posit_ref._selftest does a wide exhaustive sweep (~70-90 s); the rest are fast.
          # Default job timeout is plenty.
          python3 conformance/run_selftests.py
