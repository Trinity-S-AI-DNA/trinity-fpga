name: S³AI Brain CI — "Functional MRI" Gate

on:
  push:
    branches: [main, v*, 'feat/*', 'fix/*', 'refactor/*']
  pull_request:
    branches: [main, v*]
  workflow_dispatch:
  schedule:
    # Weekly stress test (every Sunday at 00:00 UTC)
    - cron: '0 0 * * 0'

# The comment steps below write to the PR conversation. Without an explicit
# grant the token is read-only and they fail with "Resource not accessible by
# integration", which turned a passing health check red.
permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  BRAIN_HEALTH_THRESHOLD: "80"  # Minimum health score for merge
  STRESS_TEST_THRESHOLD: "270"  # Minimum stress test score (270/300 = 90%)

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # Phase -1: Build entry-point detection
  # -------------------------------------------------------------------------
  # The S³AI "brain" (`tri` binary + `test-brain-*` targets) is driven by a
  # root `build.zig`, which is NOT present in the current RTL/HW-focused
  # trinity-fpga tree (only `build_minimal.zig` with an `hslm` step and
  # `build.zig.zon` exist at root). Without it every `zig build tri` step
  # crashes with `no build.zig file found`. This detector lets the brain jobs
  # skip honestly (no fake-pass) until a root `build.zig` returns, at which
  # point they re-activate automatically.
  # =========================================================================
  detect-build:
    name: 🔍 Detect Zig brain build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Checkout Trinity
        uses: actions/checkout@v4
      - name: Check for root build.zig
        id: check
        run: |
          if [ -f build.zig ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No root build.zig; S³AI brain CI (tri / test-brain-*) skipped (trinity-fpga is RTL/HW-focused). Re-enable when a root build.zig returns."
          fi

  # =========================================================================
  # Phase 0: Quick Health Check (fast feedback, runs on all commits)
  # =========================================================================
  brain-health-check:
    name: ⚡ Brain Health Check
    runs-on: ubuntu-latest
    needs: detect-build
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        # `tri-compile`, not `tri`: the `tri` step RUNS the CLI and installs
        # nothing, so ./zig-out/bin/tri never existed for the steps below.
        run: |
          zig build tri-compile -Dci=true

      - name: Run Brain Health Check
        id: health
        run: |
          # tee-pipefail: no shell of its own; `grep -c` below is only quoted in a comment
          # Run health check and capture output
          # tri_or_stub.sh passes a declared stub and fails anything else; the
          # `|| true` that stood here also hid a binary that was never built.
          set -o pipefail
          tools/tri_or_stub.sh stress --health 2>&1 | tee /tmp/health-output.txt

          # Extract health score
          #
          # HISTORY, because this is the second repair here and the second one
          # looks like a weakening of the gate unless you know the first.
          #
          # "0" and "no measurement" printed the same, and this gate reported
          # "Brain health 0 below 80" on all 47 of its runs. Neither half of
          # the extraction can succeed: `stress` does not accept --health
          # (grep -c '"--health"' in its handler: 0) and no .zig file prints
          # "Score:" at all. Substituting 0 turned that into a health verdict
          # about the brain instead of a fact about the pipeline, so the first
          # repair made it fail honestly instead.
          #
          # That was right about the reporting and wrong about the blast
          # radius. brain-unit `needs` this job, and integration, stress,
          # cli-smoke and metrics chain off brain-unit -- so a gate measuring
          # NOTHING was SKIPPING every real brain test in this workflow, six
          # jobs at a time, for as long as it had been failing.
          #
          # A missing measurement is now a notice rather than an error. The
          # threshold comparison below is untouched: the day
          # `tri stress --health` prints a Score, this gates again with no
          # further edit here.
          # A NOTICE, not an error: there is nothing to measure yet, and
          # failing here disabled six downstream jobs. See the block above.
          if ! grep -q "Score:" /tmp/health-output.txt; then
            echo "::notice::No health score to check -- 'tri stress --health' is a NotImplemented stub, so no measurement exists. Tracked in issue 768. This job starts gating again the moment that command prints a Score: line; nothing else here needs to change."
            exit 0
          fi
          HEALTH_SCORE=$(grep "Score:" /tmp/health-output.txt | grep -oE "[0-9]+\.[0-9]+")
          echo "HEALTH_SCORE=$HEALTH_SCORE" >> $GITHUB_OUTPUT

          # Check if healthy
          if grep -q "HEALTHY" /tmp/health-output.txt; then
            echo "HEALTHY=true" >> $GITHUB_OUTPUT
          else
            echo "HEALTHY=false" >> $GITHUB_OUTPUT
          fi

          # Fail if below threshold
          if (( $(echo "$HEALTH_SCORE < $BRAIN_HEALTH_THRESHOLD" | bc -l) )); then
            echo "::error::Brain health $HEALTH_SCORE below threshold $BRAIN_HEALTH_THRESHOLD"
            exit 1
          fi

      - name: Comment Health on PR
        if: github.event_name == 'pull_request'
        # A comment is a courtesy, not a verdict: fork PRs get a read-only token
        # whatever this file asks for, and that must not fail the gate.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.health.outputs.HEALTH_SCORE }}';
            const healthy = '${{ steps.health.outputs.HEALTHY }}' === 'true';
            const threshold = '${{ env.BRAIN_HEALTH_THRESHOLD }}';

            const emoji = healthy ? 'X' : '!';
            const status = healthy ? 'HEALTHY' : 'UNHEALTHY';
            const color = healthy ? 'green' : 'red';

            const body = `## X Brain Health Check\n\n` +
              `**Score:** ${score}/100\n` +
              `**Status:** :${color}_circle: ${status}\n` +
              `**Threshold:** ${threshold}/100\n\n` +
              `${healthy ? 'X' : 'x'} Brain is ${healthy ? 'above' : 'below'} merge threshold`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Brain Health Check')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Record Health Snapshot
        if: always()
        run: |
          ./zig-out/bin/tri stress --record || echo "Health record skipped"
          echo "X Health snapshot recorded to Hippocampus" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # Phase 1: Build Check (compile validation)
  # =========================================================================
  build-check:
    name: 🔨 Build Check
    runs-on: ubuntu-latest
    needs: detect-build
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        # `tri-compile`, not `tri`: the `tri` step RUNS the CLI and installs
        # nothing, so ./zig-out/bin/tri never existed for the steps below.
        run: |
          zig build tri-compile -Dci=true

  # =========================================================================
  # Phase 2: Unit Tests — Individual Brain Regions
  # =========================================================================
  brain-unit:
    name: 🧠 Unit Tests
    runs-on: ubuntu-latest
    # brain-health-check deliberately NOT in this list. It gated on a
    # NotImplemented command, and listing it here meant brain-unit was SKIPPED
    # on every run -- along with integration, stress, cli-smoke and metrics,
    # which chain off brain-unit. Six real jobs disabled by a gate that
    # measured nothing. Real tests must not depend on a health score that does
    # not exist yet.
    needs: [detect-build, build-check]
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        region:
          - basal-ganglia
          - reticular-formation
          - locus-coeruleus
          - intraparietal
          - hslm
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test ${{ matrix.region }}
        run: |
          zig build test-${{ matrix.region }} -Dci=true

  # =========================================================================
  # Phase 3: Integration Test — Brain Aggregator
  # =========================================================================
  brain-integration:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: [detect-build, brain-unit]
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 10
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test Brain Integration
        run: |
          zig build test-brain -Dci=true

  # =========================================================================
  # Phase 4: Stress Test — "Functional MRI" Gate
  # =========================================================================
  brain-stress:
    name: 🧪 Stress Test (Functional MRI)
    runs-on: ubuntu-latest
    needs: [detect-build, brain-integration]
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 15
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Stress Test
        id: stress
        run: |
          # HISTORY. No test prints "Score:", so the extraction below always
          # fell back to 0 and this step reported "score 0 below threshold
          # 270" on every run, including runs where every test passed. It
          # also could not see a failing test: without pipefail, `| tee`
          # reports tee's exit code and not zig's.
          #
          # The verdict is now the test run itself. As with the health score
          # above, a missing score is a notice, not a zero. The threshold
          # check is untouched and starts gating again the moment a test
          # prints a Score: line.
          set -o pipefail
          if zig build test-brain-stress -Dci=true 2>&1 | tee /tmp/stress-output.txt; then
            echo "PASSED=true" >> $GITHUB_OUTPUT
          else
            echo "PASSED=false" >> $GITHUB_OUTPUT
            echo "::error::Brain stress tests failed -- see the test output above"
            exit 1
          fi

          if ! grep -q "Score:" /tmp/stress-output.txt; then
            echo "::notice::No stress score to check -- no stress test prints a Score: line, so the verdict is the test run above. This step gates on STRESS_TEST_THRESHOLD again the moment one does."
            exit 0
          fi
          STRESS_SCORE=$(grep "Score:" /tmp/stress-output.txt | tail -1 | grep -oE "[0-9]+")
          echo "STRESS_SCORE=$STRESS_SCORE" >> $GITHUB_OUTPUT

          # Fail if below threshold
          if [ "$STRESS_SCORE" -lt "$STRESS_TEST_THRESHOLD" ]; then
            echo "::error::Stress test score $STRESS_SCORE below threshold $STRESS_TEST_THRESHOLD"
            exit 1
          fi

      - name: Comment Stress Test on PR
        if: github.event_name == 'pull_request'
        # A comment is a courtesy, not a verdict: fork PRs get a read-only token
        # whatever this file asks for, and that must not fail the gate.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.stress.outputs.STRESS_SCORE }}';
            const passed = '${{ steps.stress.outputs.PASSED }}' === 'true';
            const threshold = '${{ env.STRESS_TEST_THRESHOLD }}';

            const emoji = passed ? 'white_check_mark' : 'x';
            const status = passed ? 'PASS' : 'FAIL';
            const color = passed ? 'green' : 'red';

            // The per-phase table this comment used to print was a constant
            // 100/100 on every run, pass or fail. It reported nothing, so it
            // is gone; the score line says plainly when there is no score.
            const body = `## 🧪 Brain Stress Test Results\n\n` +
              `**Score:** ${score ? `${score}/300` : 'not measured (no stress test prints a Score: line)'}\n` +
              `**Status:** :${color}_circle: ${status}\n` +
              `**Threshold:** ${threshold}/300\n\n` +
              `${passed ? 'X' : 'x'} Stress test ${passed ? 'passed' : 'failed'}`;

            // Find or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Brain Stress Test')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Record Stress Test Result
        if: always()
        run: |
          # Record to Hippocampus
          ./zig-out/bin/tri stress --record || echo "Record skipped"

          # Upload stress test output
          echo "## 🧪 Stress Test Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat /tmp/stress-output.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Brain Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-stress-results
          path: |
            /tmp/stress-output.txt
            .trinity/brain_health_history.jsonl
          retention-days: 30

  # =========================================================================
  # Phase 5: CLI Smoke Test — Verify Commands Work
  # =========================================================================
  cli-smoke:
    name: 💨 CLI Smoke Test
    runs-on: ubuntu-latest
    needs: [detect-build, brain-stress]
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        # `tri-compile`, not `tri`: the `tri` step RUNS the CLI and installs
        # nothing, so ./zig-out/bin/tri never existed for the steps below.
        run: |
          zig build tri-compile -Dci=true

      - name: CLI Commands Test
        run: |
          # The smoke test proper: the binary exists and starts.
          ./zig-out/bin/tri version

          # Each subcommand passes, or is a stub that says so (issue 768), or
          # fails the job. See tools/tri_or_stub.sh for why not `|| true`.
          rc=0
          tools/tri_or_stub.sh task stats      || rc=1
          tools/tri_or_stub.sh task list       || rc=1
          tools/tri_or_stub.sh event stats     || rc=1
          tools/tri_or_stub.sh stress --health || rc=1
          tools/tri_or_stub.sh stress --scan   || rc=1
          exit $rc

  # =========================================================================
  # Phase 6: Brain Metrics Export (Prometheus format)
  # =========================================================================
  brain-metrics:
    name: 📊 Export Brain Metrics
    runs-on: ubuntu-latest
    needs: [detect-build, cli-smoke]
    if: needs.detect-build.outputs.present == 'true'
    timeout-minutes: 5
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        # `tri-compile`, not `tri`: the `tri` step RUNS the CLI and installs
        # nothing, so ./zig-out/bin/tri never existed for the steps below.
        run: |
          zig build tri-compile -Dci=true

      - name: Export Metrics
        run: |
          echo "# Brain Metrics Export" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          tools/tri_or_stub.sh stress --metrics >> $GITHUB_STEP_SUMMARY

      - name: Upload Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-metrics
          path: |
            .trinity/brain_health_history.jsonl
          retention-days: 90

  # =========================================================================
  # Final Gate: Brain Health Report
  # =========================================================================
  brain-health-report:
    name: 📋 Brain Health Report
    runs-on: ubuntu-latest
    needs: [detect-build, brain-health-check, build-check, brain-unit, brain-integration, brain-stress, cli-smoke]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Generate Health Report
        run: |
          echo "# 🧠 S³AI Brain Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.brain-health-check.result == 'success' && 'X PASS' || 'x FAIL' }} | Score check |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-check.result == 'success' && 'X PASS' || 'x FAIL' }} | Compile check |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.brain-unit.result == 'success' && 'X PASS' || 'x FAIL' }} | Brain regions |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.brain-integration.result == 'success' && 'X PASS' || 'x FAIL' }} | Cross-module |" >> $GITHUB_STEP_SUMMARY
          echo "| Stress Test | ${{ needs.brain-stress.result == 'success' && 'X PASS' || 'x FAIL' }} | Functional MRI |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI Smoke | ${{ needs.cli-smoke.result == 'success' && 'X PASS' || 'x FAIL' }} | Commands work |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Verdict" >> $GITHUB_STEP_SUMMARY
          # When the root build.zig is absent, all brain jobs are `skipped`
          # (see detect-build). That is an honest "not applicable" state for
          # the current RTL/HW-focused repo, not damage — do not block on it.
          if [ "${{ needs.detect-build.outputs.present }}" != "true" ]; then
            echo "### ⏭️ Brain CI skipped — no root build.zig (RTL/HW-focused repo). Non-blocking." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ "${{ needs.brain-health-check.result }}" == "success" ] && \
             [ "${{ needs.build-check.result }}" == "success" ] && \
             [ "${{ needs.brain-unit.result }}" == "success" ] && \
             [ "${{ needs.brain-integration.result }}" == "success" ] && \
             [ "${{ needs.brain-stress.result }}" == "success" ] && \
             [ "${{ needs.cli-smoke.result }}" == "success" ]; then
            echo "### X Brain Circuit HEALTHY — Safe to merge" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ! Brain Circuit DAMAGE — Fix required before merge" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Critical State Notification
        # Only a pull request has a conversation to post into; on push and
        # schedule context.issue.number is undefined and the call 404s.
        if: failure() && github.event_name == 'pull_request' && needs.detect-build.outputs.present == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🚨 CRITICAL: Brain Health Below Threshold\n\n` +
              `The brain health CI gate has failed. This PR **cannot be merged** until:\n\n` +
              `1. All brain region unit tests pass\n` +
              `2. Integration tests pass\n` +
              `3. Stress test score >= 270/300\n` +
              `4. Brain health score >= 80/100\n\n` +
              `Please review the failed job logs and fix the issues.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # =========================================================================
  # Weekly Trend Report (runs on schedule)
  # =========================================================================
  brain-trend-report:
    name: 📈 Weekly Brain Trend Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 10
    steps:
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Checkout Trinity
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build TRI Binary
        # `tri-compile`, not `tri`: the `tri` step RUNS the CLI and installs
        # nothing, so ./zig-out/bin/tri never existed for the steps below.
        run: |
          zig build tri-compile -Dci=true

      - name: Run Full Stress Test
        run: |
          zig build test-brain-stress -Dci=true 2>&1 | tee /tmp/weekly-stress.txt

      - name: Record Weekly Snapshot
        run: |
          ./zig-out/bin/tri stress --record

      - name: Generate Trend Report
        run: |
          echo "# 📈 Weekly Brain Health Trend Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Stress Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat /tmp/weekly-stress.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Health History" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ./zig-out/bin/tri stress --history 2>&1 || echo "No history available" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Weekly Report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brain-report-$(date +%Y%m%d)
          path: |
            /tmp/weekly-stress.txt
            .trinity/brain_health_history.jsonl
          retention-days: 365

  # =========================================================================
  # Merge Gate (blocks merge if brain health is poor)
  # =========================================================================
  merge-gate:
    name: 🔒 Merge Gate
    runs-on: ubuntu-latest
    needs: [brain-health-report]
    if: github.event_name == 'pull_request'
    timeout-minutes: 2
    steps:
      - name: Check Merge Eligibility
        run: |
          # All previous jobs must have passed
          if [ "${{ needs.brain-health-report.result }}" != "success" ]; then
            echo "::error::Merge gate blocked: Brain health checks failed"
            echo "PR cannot be merged until brain health is restored."
            exit 1
          fi

          echo "X Merge gate passed: Brain health is acceptable"
          echo "This PR is eligible for merge."
