name: queen-bot · PR merger, reviewer-bee gated (S-173, G-81)
# Wave v25 HOLD-A closure · maps LANG→SI MERGE (0xDE) to repo layer
# Anchor: phi^2 + phi^-2 = 3 · DOI 10.5281/zenodo.19227877
#
# ONLY WHAT A REVIEWER BEE PASSED. Owner's rule, 2026-10-02: "the Queen must
# not merge by herself!! the Queen only manages!" and "take the merge right
# away from the board merger too". No automation merges on its own verdict.
# A merge happens only after a reviewer bee -- a code-review agent with real
# tools -- has reviewed and verified the pull request. Its signals:
#   1. at least one APPROVED review, and
#   2. the `bee-reviewed` label, applied AFTER the head commit (a push after
#      the review is unreviewed code).
# `charter:r2-pass` and green CI are still required, but neither is a merge
# trigger on its own any more. Same gate as gHashTag/t27#5526
# (.github/workflows/auto-merge-ready-prs.yml).
#
# Reviewer order: approve first, then add `bee-reviewed`. The `labeled` event
# is what runs this; a label added before the approval is re-checked only on
# the next opened/synchronize/labeled event.

on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: queen-bot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  decide-and-merge:
    if: >-
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'charter:r2-pass') &&
      contains(github.event.pull_request.labels.*.name, 'bee-reviewed')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout: under pull_request_target this job holds a write token,
      # and nothing below needs the PR's files. The PR body is passed through
      # env, never interpolated into the script, so it cannot inject shell.
      - name: Verify phi-anchor footer
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s' "$PR_BODY" | grep -q "phi\^2 + phi\^-2 = 3"; then
            echo "::error::PR body missing phi-anchor footer · queen-bot refuses"
            exit 1
          fi

      - name: Reviewer-bee gate (APPROVED review + bee-reviewed after head)
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (!pr.labels.some(l => l.name === 'bee-reviewed')) {
              core.setFailed('no bee-reviewed label -- only a reviewer bee\'s review merges');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews,
              { owner, repo, pull_number, per_page: 100 });
            if (!reviews.some(r => r.state === 'APPROVED')) {
              core.setFailed('no APPROVED review -- a reviewer bee must approve before the merge');
              return;
            }
            // The gate judges the head this run will merge (the merge step
            // pins `sha` to the event's head). A newer head is unreviewed.
            const headSha = context.payload.pull_request.head.sha;
            if (pr.head.sha !== headSha) {
              core.setFailed(`head moved (${headSha} -> ${pr.head.sha}) -- unreviewed code`);
              return;
            }
            // WHEN THE HEAD ARRIVED, not when it was committed. A commit made
            // at 10:00 and pushed at 10:10 carries 10:00, so a label put on at
            // 10:05 would pass it unreviewed; a force-push back to an older SHA
            // carries an older date still. The head's time is the latest of:
            // its committer date, the first check run GitHub started on it (a
            // push starts them), and the last force-push of the branch. Same
            // hardening as gHashTag/t27#5526 (f9a6c9b). Every read throws on an
            // API error, which fails this step and so skips the merge: fail closed.
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: headSha });
            const commitAt = commit.commit.committer && commit.commit.committer.date;
            const runs = await github.paginate(github.rest.checks.listForRef,
              { owner, repo, ref: headSha, per_page: 100 });
            const runAt = runs.map(r => r.started_at).filter(Boolean).sort()[0];
            const events = await github.paginate(github.rest.issues.listEvents,
              { owner, repo, issue_number: pull_number, per_page: 100 });
            const pushedAt = events
              .filter(e => e.event === 'head_ref_force_pushed')
              .map(e => e.created_at).sort().pop();
            const stamps = [commitAt, runAt, pushedAt].filter(Boolean).map(t => new Date(t).getTime());
            const headAt = commitAt ? new Date(Math.max(...stamps)).toISOString() : null;
            const labeledAt = events
              .filter(e => e.event === 'labeled' && e.label && e.label.name === 'bee-reviewed')
              .map(e => e.created_at).sort().pop();
            if (!headAt || !labeledAt || new Date(labeledAt) < new Date(headAt)) {
              core.setFailed(`bee-reviewed (${labeledAt}) does not post-date the head's arrival (${headAt})`);
              return;
            }
            core.info(`reviewer-bee gate passed: approved, bee-reviewed at ${labeledAt} >= head at ${headAt}`);

      - name: Wait for CI green
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.pull_request.head.sha;
            const t0 = Date.now();
            const deadline = 5 * 60 * 1000; // 5 min hard cap per G-81
            while (Date.now() - t0 < deadline) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha });
              const total = data.check_runs.length;
              const success = data.check_runs.filter(c => c.conclusion === 'success').length;
              const failed  = data.check_runs.filter(c => ['failure','cancelled','timed_out'].includes(c.conclusion)).length;
              if (failed > 0) { core.setFailed(`CI red · ${failed} failed`); return; }
              if (total > 0 && success === total) { core.info('CI green'); return; }
              await new Promise(r => setTimeout(r, 15000));
            }
            core.setFailed('G-81 falsified: CI did not green within 5 min');

      - name: Merge (squash) what the reviewer bee passed
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            // `sha` pins the merge to the head the gate above checked: if a
            // commit landed in between, GitHub refuses rather than merging
            // unreviewed code.
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              sha: pr.head.sha,
              merge_method: 'squash',
              commit_title: `${pr.title} (#${pr.number})`,
              commit_message: `Merged by queen-bot after reviewer-bee review · bee-reviewed + APPROVED · charter:r2-pass · phi^2+phi^-2=3`
            });
            core.notice(`PR #${pr.number} merged by queen-bot after a reviewer bee's review`);

      - name: Audit log
        if: always()
        run: |
          mkdir -p .audit/queen-bot
          cat > ".audit/queen-bot/$(date -u +%Y%m%dT%H%M%SZ)-pr${{ github.event.pull_request.number }}.json" <<EOF2
          {
            "pr": ${{ github.event.pull_request.number }},
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "decided_at_utc": "$(date -u +%FT%TZ)",
            "outcome": "${{ job.status }}",
            "gate": "bee-reviewed+APPROVED",
            "anchor": "phi^2+phi^-2=3"
          }
          EOF2
