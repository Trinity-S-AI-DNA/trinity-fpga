name: AX7203 TRI-NET Baud Ladder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpga/vivado/trinet_node_v2_ax7203.v'
      - 'fpga/openxc7-synth/trinet_siphash24.v'
      - '.github/workflows/ax7203-trinet-baud.yml'

# One cell, three line rates, to find where the transport actually breaks.
#
# The node's divisor is fixed in the bitstream, so the board transmits at
# CFGMCLK / BAUD_DIV whatever the host asks. CFGMCLK was measured on 2026-08-02
# by sweeping the host rate and bracketing where the link holds: ~71.18 MHz,
# not the 69-70 MHz this project had recorded, with about +/-4.4% tolerated
# because the receiver re-syncs on every start bit.
#
# Divisor quantisation eats that budget before the host's own rate error counts:
#   BAUD_DIV=120 ->  593 kbaud, 0.83% quantisation   comfortable
#   BAUD_DIV=60  -> 1186 kbaud, 1.67%                within budget
#   BAUD_DIV=30  -> 2372 kbaud, 3.33%                at the edge, may fail
#
# Building all three so the fastest working one can be found by measurement
# rather than by argument.

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baud:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baud120
            div: "120"
          - name: baud60
            div: "60"
          - name: baud30
            div: "30"
    steps:
      - uses: actions/checkout@v4

      - name: Docker pull regymm/openxc7 (retry on transient 5xx)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }

      - name: Yosys
        run: |
          mkdir -p build/${{ matrix.name }}
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog fpga/openxc7-synth/trinet_siphash24.v fpga/vivado/trinet_node_v2_ax7203.v;
            chparam -set BAUD_DIV_P ${{ matrix.div }} trinet_node_v2_ax7203;
            synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7 -top trinet_node_v2_ax7203;
            setundef -zero -params; write_json build/${{ matrix.name }}/node.json" 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated|ERROR" /tmp/yosys.log
          if grep -qE '^ *[0-9]+ +DSP48' /tmp/yosys.log; then
            echo "::error::DSP48 cells inferred"; exit 1
          fi

      - uses: actions/cache@v4
        id: chipdb
        with:
          path: build/${{ matrix.name }}/chipdb/xc7a200tfbg484-2.bin
          key: chipdb-xc7a200tfbg484-2-regymm-${{ github.run_id }}-${{ matrix.name }}
          restore-keys: chipdb-xc7a200tfbg484-2-regymm-

      - if: steps.chipdb.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/${{ matrix.name }}/chipdb
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device xc7a200tfbg484-2 --bba /work/build/${{ matrix.name }}/chipdb/xc7a200tfbg484-2.bba && bbasm -l /work/build/${{ matrix.name }}/chipdb/xc7a200tfbg484-2.bba /work/build/${{ matrix.name }}/chipdb/xc7a200tfbg484-2.bin"

      - name: nextpnr (heap + sa seed search)
        run: |
          CLEAN="";
          for placer in heap sa; do
            for s in 1 2 3 4 5 6 7 8; do
              rm -f build/${{ matrix.name }}/node.fasm
              timeout 25m docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 timeout --signal=KILL 1800 nextpnr-xilinx \
                --chipdb /work/build/${{ matrix.name }}/chipdb/xc7a200tfbg484-2.bin \
                --xdc /work/specs/fpga/constraints/gf16_clean_ax7203.xdc \
                --json /work/build/${{ matrix.name }}/node.json \
                --write /work/build/${{ matrix.name }}/node_routed.json \
                --fasm /work/build/${{ matrix.name }}/node.fasm \
                --freq 50.0 --seed $s --placer $placer --router router1 --timing-allow-fail > /tmp/np_${placer}_$s.log 2>&1 || true
              if grep -q "Failed to find a route" /tmp/np_${placer}_$s.log || [ ! -f build/${{ matrix.name }}/node.fasm ]; then continue; fi
              CLEAN="$placer/$s"; break
            done
            [ -n "$CLEAN" ] && break
          done
          [ -z "$CLEAN" ] && { echo "::error::no clean seed across heap+sa x8"; tail -n 15 /tmp/np_*.log; exit 1; }
          echo "routed with placer/seed = $CLEAN"

      - name: fasm2bit
        run: |
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "
            source /prjxray/env/bin/activate && fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 /work/build/${{ matrix.name }}/node.fasm /work/build/${{ matrix.name }}/node.frames && /prjxray/build/tools/xc7frames2bit --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml --part_name xc7a200tfbg484-2 --frm_file /work/build/${{ matrix.name }}/node.frames --output_file /work/build/${{ matrix.name }}/trinet_${{ matrix.name }}.bit"
          sha256sum build/${{ matrix.name }}/trinet_${{ matrix.name }}.bit | tee build/${{ matrix.name }}/trinet_${{ matrix.name }}.bit.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: trinet-baud-${{ matrix.name }}
          path: |
            build/${{ matrix.name }}/trinet_${{ matrix.name }}.bit
            build/${{ matrix.name }}/trinet_${{ matrix.name }}.bit.sha256
