# ALINX AX7203 dual-clock heartbeat — electrical 200 MHz vs CFGMCLK discriminator.
# Streams {CFGMCLK-nibble, 200MHz-nibble} on uart_tx; read the stream to tell
# whether the 200 MHz IBUFDS->BUFG path is dead / alive / marginal.

name: AX7203 Dual-Clock Heartbeat

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'fpga/vivado/dual_clk_heartbeat_ax7203.v'
      - 'specs/fpga/constraints/dual_clk_heartbeat_ax7203.xdc'
      - '.github/workflows/ax7203-dual-clk-heartbeat.yml'

jobs:
  bitstream:
    name: Generate AX7203 Dual-Clock Heartbeat Bitstream
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Pull openXC7 Docker image
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }

      - name: Yosys synthesis
        run: |
          mkdir -p build/ax7203_dualclk
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            yosys -p "
              read_verilog fpga/vivado/dual_clk_heartbeat_ax7203.v;
              synth_xilinx -flatten -abc9 -nocarry -arch xc7 -top dual_clk_heartbeat_ax7203;
              setundef -zero -params;
              write_json build/ax7203_dualclk/dual_clk_heartbeat_ax7203.json
            " 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated number of LCs|ERROR" /tmp/yosys.log

      - id: chipdb-cache
        uses: ./.github/actions/openxc7-chipdb
        with:
          part: xc7a200tfbg484-2
          out: build/ax7203_dualclk/chipdb/xc7a200tfbg484-2.bin

      - name: nextpnr place and route (seed search for a clean $PACKER_VCC_NET route)
        run: |
          CLEAN=0
          for s in 1 2 3 4 5 6 7 8; do
            echo "::group::nextpnr seed $s"
            rm -f build/ax7203_dualclk/dual_clk_heartbeat_ax7203.fasm
            docker run --rm \
              -v "$PWD:/work" -w /work \
              regymm/openxc7 \
              nextpnr-xilinx \
                --chipdb /work/build/ax7203_dualclk/chipdb/xc7a200tfbg484-2.bin \
                --xdc /work/specs/fpga/constraints/dual_clk_heartbeat_ax7203.xdc \
                --json /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203.json \
                --write /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203_routed.json \
                --fasm /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203.fasm \
                --freq 50.0 --seed $s --placer sa --router router1 --timing-allow-fail > /tmp/nextpnr_$s.log 2>&1 || true
            echo "::endgroup::"
            if grep -q "Failed to find a route" /tmp/nextpnr_$s.log || [ ! -f build/ax7203_dualclk/dual_clk_heartbeat_ax7203.fasm ]; then
              echo "seed $s: unrouted \$PACKER_VCC_NET (or no fasm) — rejecting"
              continue
            fi
            echo "seed $s: CLEAN route — accepted"
            cp /tmp/nextpnr_$s.log /tmp/nextpnr.log
            CLEAN=$s
            break
          done
          if [ "$CLEAN" = "0" ]; then
            echo "::error::no seed in 1..8 routed cleanly (all hit unrouted \$PACKER_VCC_NET)"
            exit 1
          fi
          echo "Accepted nextpnr seed: $CLEAN"
          grep -E "Max frequency|Info: Device utilisation" /tmp/nextpnr.log || true

      - name: fasm2frames + xc7frames2bit
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            regymm/openxc7 \
            bash -c "
              source /prjxray/env/bin/activate && \
              fasm2frames \
                --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 \
                --part xc7a200tfbg484-2 \
                /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203.fasm \
                /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203.frames && \
              /prjxray/build/tools/xc7frames2bit \
                --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml \
                --part_name xc7a200tfbg484-2 \
                --frm_file /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203.frames \
                --output_file /work/build/ax7203_dualclk/dual_clk_heartbeat_ax7203.bit
            "

      - name: Verify bitstream
        run: |
          ls -lh build/ax7203_dualclk/dual_clk_heartbeat_ax7203.bit
          file build/ax7203_dualclk/dual_clk_heartbeat_ax7203.bit

      - name: Upload bitstream
        uses: actions/upload-artifact@v4
        with:
          name: ax7203-dual-clk-heartbeat-bitstream
          path: |
            build/ax7203_dualclk/dual_clk_heartbeat_ax7203.bit
            build/ax7203_dualclk/dual_clk_heartbeat_ax7203.fasm
          retention-days: 30
