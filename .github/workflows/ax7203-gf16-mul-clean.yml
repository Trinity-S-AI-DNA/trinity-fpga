name: AX7203 GF16 MUL Clean Conformance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fpga/vivado/gf16_mul_ax7203.v','fpga/openxc7-synth/gf_mul_param.v','.github/workflows/ax7203-gf16-mul-clean.yml']
# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bitstream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Docker pull regymm/openxc7 (retry on transient 5xx)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }
      - name: Yosys
        run: |
          mkdir -p build/gf16_mul
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog fpga/openxc7-synth/gf_mul_param.v fpga/vivado/gf16_mul_ax7203.v;
            synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7 -top gf16_mul_ax7203;
            setundef -zero -params; write_json build/gf16_mul/gf16_mul_ax7203.json" 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated|ERROR" /tmp/yosys.log
      - uses: actions/cache@v4
        id: chipdb
        with:
          path: build/gf16_mul/chipdb/xc7a200tfbg484-2.bin
          key: chipdb-xc7a200tfbg484-2-regymm-${{ github.run_id }}
          restore-keys: chipdb-xc7a200tfbg484-2-regymm-
      - if: steps.chipdb.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/gf16_mul/chipdb
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device xc7a200tfbg484-2 --bba /work/build/gf16_mul/chipdb/xc7a200tfbg484-2.bba && bbasm -l /work/build/gf16_mul/chipdb/xc7a200tfbg484-2.bba /work/build/gf16_mul/chipdb/xc7a200tfbg484-2.bin"
      - name: nextpnr (seed search — placer heap + per-seed timeout, lessons from gf20)
        run: |
          # --placer heap, not sa (#862). The step name already said heap; the flag did not. SA leaves invalid
          # tiles on this design ("post-placement validity check failed for Bel 'SLICE_.../A5FF'",
          # openXC7/nextpnr-xilinx#162) and placed 4 of seeds 1-16 (6, 11, 12, 15; 35-62 s each, Fmax 27.9-37.2 MHz),
          # so this loop took 98 s to reach seed 6. HeAP placed 16 of 16, 8-10 s each, Fmax 60.6-66.5 MHz
          # (regymm/openxc7 sha256:35c91073, run 37215621928).
          CLEAN=0; for s in 1 2 3 4 5 6 7 8; do
            rm -f build/gf16_mul/gf16_mul_ax7203.fasm
            timeout 20m docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 timeout --signal=KILL 1800 nextpnr-xilinx \
              --chipdb /work/build/gf16_mul/chipdb/xc7a200tfbg484-2.bin \
              --xdc /work/specs/fpga/constraints/gf16_clean_ax7203.xdc \
              --json /work/build/gf16_mul/gf16_mul_ax7203.json \
              --write /work/build/gf16_mul/gf16_mul_ax7203_routed.json \
              --fasm /work/build/gf16_mul/gf16_mul_ax7203.fasm \
              --freq 50.0 --seed $s --placer heap --router router1 --timing-allow-fail > /tmp/np_$s.log 2>&1 || true
            if grep -q "Failed to find a route" /tmp/np_$s.log || [ ! -f build/gf16_mul/gf16_mul_ax7203.fasm ]; then continue; fi
            cp /tmp/np_$s.log /tmp/np.log; CLEAN=$s; break
          done; [ "$CLEAN" = "0" ] && { echo "::error::no clean seed"; tail -n 15 /tmp/np_*.log; exit 1; }; echo "seed=$CLEAN"
      - name: fasm2bit
        run: |
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "
            source /prjxray/env/bin/activate && fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 /work/build/gf16_mul/gf16_mul_ax7203.fasm /work/build/gf16_mul/gf16_mul_ax7203.frames && /prjxray/build/tools/xc7frames2bit --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml --part_name xc7a200tfbg484-2 --frm_file /work/build/gf16_mul/gf16_mul_ax7203.frames --output_file /work/build/gf16_mul/gf16_mul_ax7203.bit"
      - uses: actions/upload-artifact@v4
        with: {name: gf16-mul-bitstream, path: build/gf16_mul/gf16_mul_ax7203.bit}
