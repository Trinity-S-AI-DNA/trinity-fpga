name: AX7203 TRI-NET Node v2 (keyed receipt + device DNA)
on:
  workflow_dispatch:
  push:
    branches: [main, tri-net-ternary-internet]
    paths:
      - 'fpga/vivado/trinet_node_v2_ax7203.v'
      - 'formal/trinet_node_v2_tb.v'
      - 'fpga/openxc7-synth/trinet_siphash24.v'
      - 'formal/trinet_siphash24_tb.v'
      - '.github/workflows/ax7203-trinet-node-v2.yml'
      # the scripts this job runs: fixing a check must re-run it
      - 'conformance/trinet_mac32_conformance_ax7203.py'
# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Golden oracle self-test (includes the SipHash vectors)
        run: python3 conformance/trinet_mac32_conformance_ax7203.py --self-test
      - name: SipHash core vs the published vectors (iverilog)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          iverilog -g2012 -o /tmp/sh.vvp formal/trinet_siphash24_tb.v fpga/openxc7-synth/trinet_siphash24.v
          vvp /tmp/sh.vvp | tee /tmp/sh.log
          grep -q "TB PASS" /tmp/sh.log || { echo "::error::the SipHash core does not match the published vectors"; exit 1; }
      - name: Node v2 keyed receipts vs the Python golden (iverilog)
        run: |
          iverilog -g2012 -o /tmp/v2.vvp formal/trinet_node_v2_tb.v fpga/vivado/trinet_node_v2_ax7203.v fpga/openxc7-synth/trinet_siphash24.v
          vvp /tmp/v2.vvp | tee /tmp/v2.log
          grep -q "TB PASS" /tmp/v2.log || { echo "::error::keyed receipts do not match the golden"; exit 1; }

  bitstream:
    needs: golden
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Docker pull regymm/openxc7 (retry on transient 5xx)
        run: |
          for i in 1 2 3 4 5 6; do
            docker pull regymm/openxc7:latest && break
            echo "::warning::docker pull attempt $i failed, sleeping $((i*20))s"; sleep $((i*20))
          done
          docker image inspect regymm/openxc7:latest >/dev/null 2>&1 || { echo "::error::docker pull failed after 6 retries"; exit 1; }
      - name: Yosys
        run: |
          mkdir -p build/trinet_node_v2
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 yosys -p "
            read_verilog fpga/openxc7-synth/trinet_siphash24.v fpga/vivado/trinet_node_v2_ax7203.v;
            synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7 -top trinet_node_v2_ax7203;
            setundef -zero -params; write_json build/trinet_node_v2/trinet_node_v2_ax7203.json" 2>&1 | tee /tmp/yosys.log
          grep -E "Estimated|ERROR" /tmp/yosys.log
          # Zero-multiplier discipline: match the cell-count column of the stat
          # table, not any mention of DSP48 in pass banners or option echoes.
          if grep -qE '^ *[0-9]+ +DSP48' /tmp/yosys.log; then
            echo "::error::DSP48 cells inferred — the zero-multiplier discipline is broken"
            grep -E '^ *[0-9]+ +DSP48' /tmp/yosys.log
            exit 1
          fi
          echo "zero-multiplier discipline: no DSP48 cells inferred"
      - uses: actions/cache@v4
        id: chipdb
        with:
          path: build/trinet_node_v2/chipdb/xc7a200tfbg484-2.bin
          key: chipdb-xc7a200tfbg484-2-regymm-${{ github.run_id }}
          restore-keys: chipdb-xc7a200tfbg484-2-regymm-
      - if: steps.chipdb.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/trinet_node_v2/chipdb
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "cd /nextpnr-xilinx && python3 xilinx/python/bbaexport.py --device xc7a200tfbg484-2 --bba /work/build/trinet_node_v2/chipdb/xc7a200tfbg484-2.bba && bbasm -l /work/build/trinet_node_v2/chipdb/xc7a200tfbg484-2.bba /work/build/trinet_node_v2/chipdb/xc7a200tfbg484-2.bin"
      - name: nextpnr (heap + sa seed search — the recipe large datapaths need)
        run: |
          CLEAN="";
          for placer in heap sa; do
            for s in 1 2 3 4 5 6 7 8; do
              rm -f build/trinet_node_v2/trinet_node_v2_ax7203.fasm
              timeout 25m docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 timeout --signal=KILL 1800 nextpnr-xilinx \
                --chipdb /work/build/trinet_node_v2/chipdb/xc7a200tfbg484-2.bin \
                --xdc /work/specs/fpga/constraints/gf16_clean_ax7203.xdc \
                --json /work/build/trinet_node_v2/trinet_node_v2_ax7203.json \
                --write /work/build/trinet_node_v2/trinet_node_v2_ax7203_routed.json \
                --fasm /work/build/trinet_node_v2/trinet_node_v2_ax7203.fasm \
                --freq 50.0 --seed $s --placer $placer --router router1 --timing-allow-fail > /tmp/np_${placer}_$s.log 2>&1 || true
              if grep -q "Failed to find a route" /tmp/np_${placer}_$s.log || [ ! -f build/trinet_node_v2/trinet_node_v2_ax7203.fasm ]; then continue; fi
              cp /tmp/np_${placer}_$s.log /tmp/np.log; CLEAN="$placer/$s"; break
            done
            [ -n "$CLEAN" ] && break
          done
          [ -z "$CLEAN" ] && { echo "::error::no clean seed across heap+sa x8"; tail -n 15 /tmp/np_*.log; exit 1; }
          echo "routed with placer/seed = $CLEAN"
      - name: fasm2bit
        run: |
          docker run --rm -v "$PWD:/work" -w /work regymm/openxc7 bash -c "
            source /prjxray/env/bin/activate && fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 /work/build/trinet_node_v2/trinet_node_v2_ax7203.fasm /work/build/trinet_node_v2/trinet_node_v2_ax7203.frames && /prjxray/build/tools/xc7frames2bit --part_file /nextpnr-xilinx/xilinx/external/prjxray-db/artix7/xc7a200tfbg484-2/part.yaml --part_name xc7a200tfbg484-2 --frm_file /work/build/trinet_node_v2/trinet_node_v2_ax7203.frames --output_file /work/build/trinet_node_v2/trinet_node_v2_ax7203.bit"
          sha256sum build/trinet_node_v2/trinet_node_v2_ax7203.bit | tee build/trinet_node_v2/trinet_node_v2_ax7203.bit.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: trinet-node-v2-bitstream
          path: |
            build/trinet_node_v2/trinet_node_v2_ax7203.bit
            build/trinet_node_v2/trinet_node_v2_ax7203.bit.sha256
