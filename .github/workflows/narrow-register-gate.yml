name: Narrow register gate

# A register narrower than the constant it is compared against, or than the slice
# assigned into it, is legal Verilog and silent in yosys. Established by
# research/witness_narrow_register_silence.py, which exercises five narrowings --
# comparison, assignment, slice, port connection, dead control branch -- on minimal
# modules and gets no width warning on any of them.
#
# This header used to cite pass 146 running yosys over trinity_v1_morse.v and seeing
# zero warnings. yosys has never been able to read that file: line 113 is a
# SystemVerilog assignment pattern rejected as OP_CAST, in plain mode and under -sv,
# and the revision that preceded pass 146's own edit fails at the same construct.
# Zero warnings is what a refused read produces. The claim was right; the evidence
# for it was a failure misread as a silence. Corrected in pass 278.
#
# Fifteen real defects were found this way,
# including a UART frame counter that terminated on the wrong count and six GF8 decode
# wrappers whose exponent slice dropped its top bit.
#
# Findings that have been read and judged benign live in the script's ACCEPTED table
# with the reason written out, so this gate fails only on something new.

on:
  push:
    branches: [main]
    paths:
      - 'fpga/**/*.v'
      - 'research/audit_narrow_register.py'
      - '.github/workflows/narrow-register-gate.yml'
  pull_request:
    paths:
      - 'fpga/**/*.v'
      - 'research/audit_narrow_register.py'
      - '.github/workflows/narrow-register-gate.yml'
  workflow_dispatch:

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  narrow-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No register narrower than what is put in it
        run: |
          python3 research/audit_narrow_register.py
