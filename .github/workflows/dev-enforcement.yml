name: Dev Workflow Enforcement

# This gate had never run a single job, and each layer of it was broken
# independently. Recorded here because the failure mode is the interesting part:
# every layer failed in a way that looked like the layer below it.
#
# 1. The YAML did not parse. In the pr-status job `steps:` was indented inside
#    `if:`, and further down `run:` inside `if:`. GitHub therefore compiled zero
#    jobs and titled the run by its file path rather than by `name:` — which is
#    what a red X on ".github/workflows/dev-enforcement.yml" means.
# 2. No job had an actions/checkout step, so `git log -1` ran outside a
#    repository and .trinity/dev_session.json was never on disk.
# 3. `$COMMIT` was never assigned, so the issue-ID test read an empty string and
#    could only ever print "Missing issue ID" — including for a correct commit.
# 4. The commit-format regex was `^\[a-f]+\(...`, which requires a literal `[`
#    at the start of the subject. No conventional commit begins with one. Its
#    result was piped to `head -1` and discarded regardless.
# 5. session-check gated CI on .trinity/dev_session.json being in TESTED or
#    COMMITTED. That file is local working state; on main it asserts whatever
#    state happened to be committed, which is not a property of the change.
#
# Fixing only the indentation would have turned "never ran" into "fails every
# push", which is worse. So this now checks the thing it always said it was
# checking, in the words of its own error messages: conventional commit format,
# and a reference to an issue. The session-state job is gone — CI cannot observe
# a local dev session, and a gate that cannot observe its subject is decoration.

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A newer push or PR commit replaces this file's pending run instead of
# queueing behind it; a dispatch is never cancelled (gHashTag/trinity-fpga#869).
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-format:
    name: CI Validation
    runs-on: ubuntu-latest
    steps:
      # Full history, unconditionally. The first version used
      #   fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      # which evaluates to 1 on a pull request, not 0: `true && 0` is `0`, `0` is
      # falsy, so `|| 1` wins. Latent here because this copy has only ever run
      # on push; it killed the trinity copy on its first PR with
      # `fatal: Invalid revision range <base>..<head>`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit format
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if [ -n "${BASE:-}" ] && [ -n "${HEAD:-}" ]; then
            RANGE="$BASE..$HEAD"
          else
            RANGE="-1"
          fi

          # A merge commit's subject is generated by GitHub, not by an author,
          # so holding it to the format would fail every merge.
          SUBJECTS=$(git log --no-merges --format=%s $RANGE)
          if [ -z "$SUBJECTS" ]; then
            echo "no non-merge commits to check"
            exit 0
          fi

          # feat(scope): description   — the format this repository documents in
          # CLAUDE.md and .claude/rules/git-workflow.md. The scope is required
          # there, so it is required here.
          PATTERN='^(feat|fix|refactor|docs|chore|test|ci|perf|build|style)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r s; do
            if echo "$s" | grep -qE "$PATTERN"; then
              echo "ok    $s"
            else
              echo "BAD   $s"
              bad=$((bad + 1))
            fi
          done <<< "$SUBJECTS"

          # Blocking on a pull request, reporting on a push.
          #
          # Measured before choosing: of the last 60 non-merge commits on main,
          # 3 would fail — deliberate prose subjects such as "Five of nine
          # rungs, not four: TEF64 has been measured since that line was
          # written". Enforcing on push would put a red X on 5% of the
          # maintainer's own history, retroactively, with nothing to do about
          # it; that is how a gate gets switched off. On a pull request the
          # subject can still be amended, so there it blocks.
          if [ "$bad" -gt 0 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "::error::$bad commit subject(s) do not match <type>(<scope>): <description>"
              exit 1
            fi
            echo "::warning::$bad commit subject(s) do not match <type>(<scope>): <description>"
            exit 0
          fi
          echo "all subjects well formed"

      # Reported, not enforced. The repository's rules ask for an issue
      # reference, but they are also explicit that pipeline-generated commits
      # exist, and failing those would make the gate the thing people work
      # around. It says what it sees and leaves the decision to a reader.
      - name: Issue reference
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u
          BLOB="$(git log --no-merges --format='%s %b' "$BASE..$HEAD")
          $TITLE
          $BODY"
          if echo "$BLOB" | grep -qoE '(ISSUE-|#)[0-9]+'; then
            echo "issue reference found: $(echo "$BLOB" | grep -oE '(ISSUE-|#)[0-9]+' | sort -u | tr '\n' ' ')"
          else
            echo "::warning::no issue reference (#123 or ISSUE-123) in the commits, title or body"
          fi
